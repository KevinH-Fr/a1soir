<!DOCTYPE html>
<html lang="fr">
<head>
  <title>Page introuvable — Autour d'un Soir</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <style>
    html, body { margin: 0; min-height: 100%; background: #000; color: #f8f9fa; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    header { padding: 1.25rem 0.75rem; }
    header img { height: 40px; width: auto; }
    main { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; }
    .card {
      width: 100%;
      max-width: 32rem;
      text-align: center;
      padding: 2rem 1.5rem;
      background: linear-gradient(135deg, rgba(5,5,5,.85) 0%, rgba(15,15,15,.9) 40%, rgba(30,30,30,.95) 100%);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 4px;
    }
    h1 { font-size: 1.15rem; font-weight: 500; margin: 0 0 .75rem; }
    p { margin: 0 0 1.5rem; font-size: .9rem; opacity: .75; }
    a.btn {
      display: inline-block;
      padding: .5rem 1.5rem;
      background: #f8f9fa;
      color: #000;
      text-decoration: none;
      border-radius: 2px;
      font-size: .95rem;
    }
  </style>
</head>
<body>
  <header>
    <a href="/fr/home"><img src="/images/a1soirlogo2.png" alt="Autour d'un Soir"></a>
  </header>
  <main>
    <div class="card">
      <h1>Page introuvable</h1>
      <p>Cette page n'existe pas ou n'est plus disponible.</p>
      <a class="btn" href="/fr/home">Retour à la boutique</a>
    </div>
  </main>
</body>
</html>
