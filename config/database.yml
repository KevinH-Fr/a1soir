# This branch uses PostgreSQL in development/test. The existing SQLite files
# in storage/ (development.sqlite3, test.sqlite3) are left untouched; switch
# back to the previous branch to use them again.

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: developpement_pg

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: test_pg

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
