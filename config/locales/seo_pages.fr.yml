      robe_de_mariee_cannes:
        link_title: Robe de mariée Cannes
        header_title: Robe de mariée à Cannes
        header_subtitle: Boutique de mariage à Cannes — collections, essayage et retouches depuis 1980
        intro_html: '<p>Depuis 1980, <strong>Autour D''Un Soir</strong> est une boutique de mariage à Cannes qui accompagne les futures mariées sur la Côte d''Azur. Contrairement à un e-shop, nous vous recevons en cabine d''essayage : vous touchez les matières, testez les coupes et bénéficiez de retouches réalisées par notre atelier jusqu''au jour J.</p><p>Robes courtes ou longues, styles bohème, princesse ou sirène : notre équipe de conseillères et couturières vous guide pour trouver la robe qui correspond à votre morphologie, votre budget et l''ambiance de votre mariage. Découvrez aussi notre <a href="/fr/guides/comment-choisir-sa-robe-de-mariee">guide pour choisir sa robe</a> avant votre rendez-vous.</p>'
        cta_title: Réservez votre essayage à Cannes
        sections:
          histoire:
            title: Quarante ans de robes de mariée à Cannes
            body_html: "<p>À l'ouverture de la boutique en 1980, les mariées privilégiaient souvent les robes longues classiques, dentelles et traînes marquées. Au fil des décennies, nous avons vu arriver les coupes princesse, les lignes sirène, puis l'essor du style bohème et des mariages en extérieur sur la Côte d'Azur.</p><p>Cette expérience nous permet de vous orienter avec discernement : nous connaissons ce qui photographie bien en lumière méditerranéenne, ce qui convient à une cérémonie en domaine provençal ou à une réception en soirée à Cannes. Chaque collection est choisie pour allier élégance, confort et finitions soignées.</p>"
          boutique:
            title: Une adresse de référence à Cannes
            body_html: '<p>Notre boutique du 29 boulevard Carnot accueille les mariées en rendez-vous personnalisé. Vous n''êtes pas seule face à un rail de robes : une conseillère prépare une sélection selon vos envies, votre morphologie et la date de votre mariage.</p><p>L''essayage se déroule en cabine spacieuse ; vous pouvez venir accompagnée de proches. Nos couturières assurent ensuite les retouches (longueur, buste, bretelles) pour un tombé impeccable. En savoir plus sur <a href="/fr/la_boutique">notre boutique et notre équipe</a>.</p>'
          collections:
            title: Des collections pour chaque style
            body_html: "<p>Nous proposons des robes de mariée courtes et longues, en crêpe, satin, tulle ou dentelle. Les silhouettes vont du fourreau épuré à la robe princesse volumineuse, en passant par la sirène et les modèles bohème à manches fluides.</p><p>Toutes nos robes de mariée sont <strong>vendues en boutique</strong> : vous repartez avec une pièce ajustée à votre morphologie, et non une location standardisée. Parcourez une sélection en ligne, puis affinez votre choix lors de l'essayage.</p>"
          services:
            title: Essayage, retouches et accompagnement
            body_html: '<p>Le rendez-vous est fortement recommandé pour garantir la disponibilité d''une conseillère et une préparation de cabine. Idéalement, commencez vos recherches <strong>8 à 12 mois</strong> avant le mariage afin de profiter du plus large choix et des délais d''atelier.</p><p>Les retouches font partie de notre accompagnement : prise de mesures en boutique, ajustements progressifs et contrôle final avant le jour J. Pour préparer votre visite, consultez la page <a href="/fr/essayage-robe-de-mariee-cannes">essayage robe de mariée à Cannes</a>.</p>'
          acces:
            title: Venir en boutique depuis la région
            body_html: "<p>La boutique est à deux pas de la gare de Cannes. En voiture depuis Nice : environ 30 minutes (A8 sortie 42 ou bord de mer). Depuis Antibes : 20 minutes ; depuis Monaco : 45 minutes. Parkings publics à proximité (Mozart, Saint-Nicolas, Vauban).</p><p>En train, le TER Nice–Cannes vous dépose à 5 minutes à pied du magasin. Pensez à réserver votre créneau d'essayage à l'avance, surtout en haute saison mariage sur la Riviera.</p>"
        faq:
          q1:
            question: Où essayer une robe de mariée à Cannes ?
            answer_html: "<p>Chez Autour D'Un Soir, 29 boulevard Carnot à Cannes. Prenez rendez-vous en ligne ou par téléphone au 04 93 45 17 17.</p>"
          q2:
            question: Proposez-vous la location de robes de mariée ?
            answer_html: "<p>Non. Nos robes de mariée sont proposées à la vente uniquement, afin de garantir des retouches définitives et une coupe parfaitement adaptée à votre silhouette.</p>"
          q3:
            question: Combien de temps avant le mariage faut-il commander sa robe ?
            answer_html: "<p>Nous conseillons de commencer 8 à 12 mois avant la date. Cela laisse le temps des essayages, de la commande fournisseur si besoin et des retouches en atelier.</p>"
          q4:
            question: Combien d'essayages prévoir ?
            answer_html: "<p>En général, deux à trois rendez-vous suffisent : une première découverte des styles, un second pour affiner le modèle et accessoires, puis un essayage final après retouches.</p>"
          q5:
            question: Faut-il prévoir un budget pour les retouches et accessoires ?
            answer_html: "<p>Oui. Outre la robe, prévoyez voile, chaussures, bijoux et éventuelles retouches spécifiques. En boutique, nous vous aidons à équilibrer l'ensemble de votre look avec votre enveloppe globale.</p>"
      essayage_robe_de_mariee_cannes:
        link_title: Essayage robe de mariée Cannes
        header_title: Essayage robe de mariée à Cannes
        header_subtitle: Un moment privilégié en cabine d'essayage
        intro_html: '<p>L''essayage est le moment où la robe devient réelle : vous sentez les matières, observez le tombé en mouvement et partagez l''émotion avec vos proches. Chez Autour D''Un Soir à Cannes, chaque rendez-vous est préparé en amont par une conseillère qui connaît notre collection.</p><p>Que vous veniez de Cannes ou de la région, nous vous accueillons en cabine spacieuse. Consultez d''abord notre guide <a href="/fr/guides/comment-choisir-sa-robe-de-mariee">comment choisir sa robe</a> pour arriver avec des idées claires.</p>'
        cta_title: Réserver mon essayage
        sections:
          deroulement:
            title: Comment se déroule l'essayage ?
            body_html: "<p>Après réservation, nous préparons une sélection selon votre date de mariage, votre budget et vos références visuelles. En cabine, vous essayez plusieurs silhouettes : princesse, sirène, bohème, fourreau.</p><p>Votre conseillère prend des notes, photographie les modèles favoris (avec votre accord) et planifie les retouches si vous validez un achat. Comptez environ 1h30 à 2h pour un premier rendez-vous serein.</p>"
          conseils:
            title: Nos conseils avant l'essayage
            body_html: "<p>Apportez des sous-vêtements couleur chair, des talons de hauteur proche du jour J, et 5 à 10 photos d'inspiration — pas une liste interminable. Limitez-vous à 1 ou 2 accompagnants dont vous faites confiance au jugement.</p><p>Évitez le maquillage foncé sur le décolleté et les bronzages frais qui peuvent fausser le rendu des dentelles claires. Arrivez 10 minutes en avance pour vous installer tranquillement.</p>"
          retouches:
            title: 'Après le choix : retouches et planning'
            body_html: '<p>Une fois la robe choisie, notre atelier planifie les retouches : ourlets, pinces, bretelles, traîne. Un second rendez-vous valide le tombé après travaux.</p><p>Les robes de mariée sont vendues en boutique — pas en location — pour garantir un ajustement définitif. Découvrez nos collections sur la page <a href="/fr/robe-de-mariee-cannes">robe de mariée Cannes</a>.</p>'
          acces:
            title: Venir en boutique
            body_html: "<p>29 boulevard Carnot, 5 minutes de la gare de Cannes. Parking à proximité. Environ 30 min depuis Nice, 20 min depuis Antibes, 45 min depuis Monaco.</p><p>Réservez votre créneau en ligne ou par téléphone, surtout de mars à septembre, haute saison mariage sur la Riviera.</p>"
        faq:
          q1:
            question: Le rendez-vous est-il obligatoire ?
            answer_html: "<p>Fortement recommandé : une conseillère dédiée et une cabine préparée vous attendent. Sans RDV, l'accueil dépend de l'affluence du moment.</p>"
          q2:
            question: Accueillez-vous des clientes de toute la région ?
            answer_html: "<p>Oui, Nice, Antibes, Monaco et les Alpes-Maritimes. Essayage privé et retouches sur place à Cannes.</p>"
          q3:
            question: Combien de robes peut-on essayer ?
            answer_html: "<p>Lors du premier rendez-vous, nous prévoyons généralement 6 à 8 modèles ciblés, puis d'autres lors d'un second passage si besoin.</p>"
          q4:
            question: Peut-on venir avec sa mère ou ses témoins ?
            answer_html: "<p>Oui, 1 à 2 personnes sont les bienvenues. Au-delà, l'avis peut devenir confus — choisissez ceux dont vous valorisez le regard.</p>"
      costume_mariage_cannes:
        link_title: Costume mariage Cannes
        header_title: Costume & smoking de mariage à Cannes
        header_subtitle: Tenues de cérémonie pour hommes et enfants
        intro_html: '<p>Marié, témoin ou invité d''honneur : la tenue masculine structure l''élégance du cortège. À Cannes, Autour D''Un Soir propose smokings, costumes trois pièces et tenues enfants, en <strong>location ou vente</strong>, avec essayage et retouches en atelier.</p><p>Notre équipe vous oriente selon le dress code — jour, soirée, plage ou gala. Comparez <a href="/fr/guides/smoking-ou-costume-mariage">smoking ou costume</a> et nos formules de <a href="/fr/guides/location-smoking-costume-cannes">location à Cannes</a>.</p>'
        cta_title: Découvrir nos costumes en boutique
        sections:
          collections:
            title: Smokings et costumes
            body_html: "<p>Smoking noir ou midnight blue, costume bleu marine, beige ou gris anthracite : coupes slim ou classiques, toujours ajustables en boutique. Chemises, nœuds papillon, cravates et pochettes coordonnées sur place.</p><p>La location sur 4 jours convient à un mariage ponctuel ; l'achat se justifie si vous portez régulièrement une tenue de cérémonie. Nous comparons les deux options sans parti pris.</p>"
          essayage:
            title: Essayage et retouches
            body_html: "<p>Apportez vos chaussures de cérémonie à l'essayage : la longueur de pantalon et la posture se jugent debout. Notre atelier gère ourlets, pinces et manches.</p><p>Le rendez-vous est recommandé, surtout entre avril et juin (mariages et Festival de Cannes). Réservez tôt pour garantir taille et couleur.</p>"
          enfants:
            title: Tenues pour les plus jeunes
            body_html: "<p>Garçons d'honneur et enfants du cortège : costumes adaptés, couleurs harmonisées avec le marié. Location ou vente selon modèles.</p><p>Un essayage groupé famille simplifie les couleurs et les photos officielles.</p>"
          acces:
            title: Boutique à Cannes
            body_html: "<p>29 boulevard Carnot, proche de la gare. Environ 30 min depuis Nice, 20 min depuis Antibes, 45 min depuis Monaco. Parkings publics à proximité.</p>"
        faq:
          q1:
            question: Puis-je essayer un costume si je viens de Nice ou Antibes ?
            answer_html: "<p>Oui, sur rendez-vous. La boutique est à Cannes, accessible en train ou voiture.</p>"
          q2:
            question: Location ou achat pour un mariage ?
            answer_html: "<p>Location pour un événement unique ; achat si vous réutilisez la tenue. Nos conseillers vous orientent selon votre situation.</p>"
          q3:
            question: Proposez-vous des smokings pour le Festival de Cannes ?
            answer_html: "<p>Oui, avec essayage et réservation anticipée recommandés en mai.</p>"
      comment_choisir_sa_robe_de_mariee:
        link_title: Comment choisir sa robe de mariée
        header_title: Comment choisir sa robe de mariée ?
        header_subtitle: 'Style, budget, délais : nos conseils d''expertes'
        intro_html: '<p>Choisir sa robe de mariée peut sembler intimidant : les inspirations circulent vite, les avis se contredisent et la peur de se tromper est légitime. Pourtant, la robe de mariée reste d''abord un vêtement construit : une coupe, une matière, un tombé, une façon de bouger.</p><p>Ce guide ne remplace pas la cabine d''essayage — c''est là que la robe prend vie sur vous — mais il vous aide à comprendre les critères utiles : style, budget, calendrier, confort et cohérence avec le lieu. Vous pourrez ensuite réserver un rendez-vous sur notre page <a href="/fr/robe-de-mariee-cannes">robes de mariée à Cannes</a>.</p>'
        sections:
          style:
            title: Définir son style
            body_html: "<p>Commencez par votre mariage, pas par une tendance : lieu (église, plage, domaine), saison, niveau de formalité. Un mariage champêtre en Provence oriente souvent vers des matières fluides ; une réception en soirée à Cannes peut appeler une ligne plus structurée, plus lisible sous une lumière artificielle.</p><p>Repérez les grandes familles : <strong>bohème</strong> (dentelle, manches, mouvement), <strong>princesse</strong> (jupe volumineuse), <strong>sirène</strong> (coupe près du corps), <strong>minimaliste</strong> (ligne épurée). Derrière ces noms, il y a surtout des choix techniques : volume de jupe, tenue du buste, poids du tissu, souplesse du crêpe ou relief de la dentelle. Apportez 5 à 10 photos de référence à l'essayage, pas une liste de 50 modèles contradictoires.</p>"
          budget:
            title: Anticiper son budget
            body_html: "<p>La robe n'est qu'une partie du budget « tenue » : prévoyez voile ou cape, chaussures, bijoux, éventuelle seconde robe, et retouches. En boutique, nous indiquons clairement ce qui est inclus dans le prix affiché.</p><p>Fixez une enveloppe globale avant l'essayage et communiquez-la à votre conseillère : cela évite de tomber amoureuse d'un modèle hors budget. Nous savons proposer des alternatives dans la même famille de style à des prix différents.</p>"
          delais:
            title: Respecter les délais
            body_html: "<p>Idéalement, commencez 8 à 12 mois avant le mariage. Certains modèles sont disponibles immédiatement ; d'autres nécessitent une commande fournisseur (12 à 16 semaines). Les retouches en atelier demandent aussi plusieurs passages.</p><p>En période chargée sur la Côte d'Azur (printemps–été), les créneaux d'essayage partent vite : réservez tôt, même si vous n'avez pas encore fixé tous les détails de la décoration.</p>"
          essayage:
            title: Préparer son essayage en cabine
            body_html: '<p>Portez des sous-vêtements couleur chair, des talons de hauteur proche du jour J et peu de maquillage sur les cols. Venez avec 1 ou 2 personnes de confiance — trop d''avis peuvent brouiller votre ressenti.</p><p>En cabine, avancez par étapes : silhouette d''abord, matière ensuite, détails en dernier. Une robe doit se juger debout, assise et en mouvement : le tissu peut tomber parfaitement devant un miroir mais tirer au niveau du buste, peser sur les épaules ou gêner la marche. Détails sur <a href="/fr/essayage-robe-de-mariee-cannes">l''essayage à Cannes</a>.</p>'
          morphologie:
            title: Morphologie et coupe
            body_html: '<p>Les guides morphologie (sirène, princesse, fourreau) donnent des pistes, mais seul l''essayage tranche : une même coupe peut surprendre positivement. Consultez notre guide <a href="/fr/guides/robe-de-mariee-morphologie">robe et morphologie</a> pour affiner vos recherches.</p><p>Notre équipe observe votre posture, la longueur de buste et la répartition des volumes pour orienter vers les modèles qui vous subliment — sans vous enfermer dans une case.</p>'
          erreurs:
            title: Erreurs fréquentes à éviter
            body_html: "<p>Acheter trop tôt sans avoir validé le style de mariage, ou au contraire attendre la dernière minute. Copier la robe d'une influenceuse sans tenir compte de votre morphologie. Venir avec un comité trop nombreux qui impose son avis.</p><p>Oublier le confort : vous porterez la robe plusieurs heures, vous danserez peut-être. Négliger les accessoires jusqu'au dernier moment alors qu'ils changent la silhouette. Enfin, confondre location de soirée et achat de robe de mariée : chez nous, les robes de mariée sont <strong>vendues</strong>, pour des retouches définitives.</p>"
          histoire:
            title: Comment les goûts ont évolué en boutique
            body_html: "<p>Les goûts changent par cycles. Les années 80 ont laissé une place aux manches marquées et aux volumes visibles ; les années 90 et 2000 ont vu revenir des lignes plus sobres ; les années 2010 ont popularisé les robes bohèmes, les dos travaillés et les mariages très personnalisés.</p><p>Ces évolutions montrent qu'une robe de mariée n'est jamais isolée de son époque. Pour éviter l'effet déguisement ou la tendance trop datée, observez ce qui reste lisible dans le temps : une belle proportion, une matière de qualité, un détail placé au bon endroit. C'est souvent cela qui résiste le mieux sur les photos.</p>"
        faq:
          q1:
            question: Quand commencer à chercher sa robe de mariée ?
            answer_html: "<p>8 à 12 mois avant la date est idéal. Vous disposez du meilleur choix et des délais d'atelier sans stress.</p>"
          q2:
            question: Faut-il prévoir un budget pour les accessoires ?
            answer_html: "<p>Oui : voile, chaussures, bijoux et retouches éventuelles s'ajoutent au prix de la robe. En boutique, nous vous aidons à planifier l'ensemble.</p>"
          q3:
            question: Puis-je venir accompagnée à l'essayage ?
            answer_html: "<p>Oui, 1 à 2 proches suffisent. Trop de personnes peuvent rendre la décision plus difficile.</p>"
          q4:
            question: Faut-il une robe de rechange pour la soirée ?
            answer_html: "<p>C'est un plus pour danser librement, surtout avec une robe longue ou traîne. Ce n'est pas obligatoire : à vous de voir selon le déroulé de votre réception.</p>"
          q5:
            question: Peut-on louer une robe de mariée chez Autour D'Un Soir ?
            answer_html: "<p>Non. Les robes de mariée sont vendues en boutique pour garantir retouches et ajustement définitifs. En revanche, nous proposons location pour de nombreuses tenues de soirée.</p>"
      robe_de_mariee_boheme:
        link_title: Robe de mariée bohème
        header_title: Robe de mariée bohème
        header_subtitle: Fluide, romantique et naturelle
        intro_html: '<p>La robe de mariée bohème associe liberté, romantisme et confort : matières fluides, dentelles délicates, dos ouvert ou manches légères. Son esthétique s''inscrit dans une histoire plus large, entre inspirations folk, goût des matières naturelles et cérémonies moins formelles que les mariages très classiques.</p><p>Très demandée sur la Côte d''Azur pour les mariages en plein air, elle convient aux cérémonies au bord de l''eau ou dans les domaines de Provence. Ce guide vous aide à affiner vos critères avant le rendez-vous ; pour le choix global, voir aussi <a href="/fr/guides/comment-choisir-sa-robe-de-mariee">comment choisir sa robe de mariée</a>.</p>'
        sections:
          matieres:
            title: Matières et détails
            body_html: "<p>Le bohème mise sur le mouvement : crêpe léger, tulle souple, dentelle guipure, broderies florales ou manches en transparence. La guipure, plus épaisse et dessinée que certaines dentelles fines, donne un relief visible en photo ; le crêpe apporte au contraire une ligne plus fluide et plus mate.</p><p>Côté détails : dos nu ou en V, ceintures fines, petites traînes ou traînes amovibles pour la soirée. Les finitions peuvent paraître plus libres (franges, motifs floraux, bords festonnés), mais elles demandent autant de précision qu'une robe très structurée.</p>"
          coupe:
            title: Coupes et silhouettes
            body_html: "<p>La robe bohème n'est pas une seule coupe : elle peut être fluide type empire, légèrement sirène, ou près du corps avec jupe évasée. Les manches longues en dentelle sont emblématiques, mais les bretelles fines ou le bustier fonctionnent aussi.</p><p>Pensez à votre confort : marche sur le sable, vent en bord de mer, chaleur estivale. En cabine, nous testons la robe en mouvement, pas seulement face au miroir.</p>"
          saison_lieu:
            title: Saison et lieu de réception
            body_html: "<p>En été sur la Riviera, privilégiez des matières respirantes et une robe qui ne traîne pas trop sur un sol sablonneux ou herbeux. Pour un domaine en Provence, les tons ivoire, champagne et dentelle ivoire s'intègrent parfaitement au décor.</p><p>Un mariage bohème en intérieur reste possible : adaptez alors la longueur de traîne et le niveau de transparence. Discutez-en avec votre conseillère lors de l'essayage à Cannes.</p>"
          accessoires:
            title: Accessoires bohème
            body_html: '<p>Couronne de fleurs, voile léger, sandales plates ou talons compensés, bijoux dorés discrets : les accessoires complètent la robe sans la surcharger. Évitez les diadèmes trop « princesse » si votre ligne est naturelle.</p><p>En boutique, nous coordonnons voile, bijoux et chaussures avec la robe choisie. Voir aussi notre guide <a href="/fr/guides/chaussures-accessoires-soiree">chaussures et accessoires</a>.</p>'
          histoire:
            title: Le style bohème en boutique
            body_html: "<p>Le style bohème bridal s'est surtout diffusé dans les années 2010, avec l'essor des cérémonies en extérieur, des mariages plus personnels et des références visuelles partagées en ligne. Il reprend aussi des codes plus anciens : dentelle, manches souples, couronnes florales, silhouettes moins corsetées.</p><p>Sur la Côte d'Azur, ce style doit rester concret : vent, chaleur, lumière forte, photos en extérieur. Une robe bohème réussie n'est pas seulement jolie sur cintre ; elle garde son tombé quand on marche, quand on s'assoit et quand la cérémonie se prolonge.</p>"
        faq:
          q1:
            question: La robe bohème convient-elle à un mariage sur la plage ?
            answer_html: "<p>Oui, à condition de choisir une longueur adaptée (traîne courte ou amovible) et des matières légères. L'essayage permet de valider le confort en mouvement.</p>"
          q2:
            question: Dentelle ou crêpe pour un look bohème ?
            answer_html: "<p>Les deux fonctionnent : dentelle pour le romantisme, crêpe pour un tombé fluide et moderne. Souvent, les robes combinent les deux.</p>"
          q3:
            question: Quelle robe bohème selon ma morphologie ?
            answer_html: <p>Le bohème s'adapte à plusieurs silhouettes grâce aux coupes fluides et aux ceintures. Consultez notre guide <a href="/fr/guides/robe-de-mariee-morphologie">morphologie</a> puis confirmez en cabine.</p>
          q4:
            question: Où essayer une robe de mariée bohème à Cannes ?
            answer_html: <p>Chez Autour D'Un Soir, 29 boulevard Carnot. Réservez un essayage sur la page <a href="/fr/robe-de-mariee-cannes">robe de mariée Cannes</a>.</p>
      robe_de_mariee_morphologie:
        link_title: Robe de mariée morphologie
        header_title: Quelle robe selon sa morphologie ?
        header_subtitle: Sirène, princesse, fourreau, bustier
        intro_html: '<p>Les guides morphologie donnent des repères, mais aucune règle ne remplace l''essayage : une robe sirène peut surprendre une silhouette qu''on croyait « princesse only ». Une coupe fonctionne grâce à des éléments très concrets : placement de la taille, soutien du buste, ampleur de jupe, verticalité des lignes.</p><p>Ce guide vous aide à cibler vos recherches avant le rendez-vous sans vous enfermer dans une catégorie. Ensuite, affinez sur <a href="/fr/essayage-robe-de-mariee-cannes">l''essayage à Cannes</a> et notre page <a href="/fr/robe-de-mariee-cannes">robes de mariée</a>.</p>'
        sections:
          sirene:
            title: Robe sirène
            body_html: "<p>La sirène épouse le buste et les hanches, puis s'évase généralement autour du genou ou un peu au-dessus selon les modèles. Elle crée une ligne très dessinée, appréciée pour son effet sculptural.</p><p>Techniquement, tout se joue dans l'équilibre entre maintien et aisance : si l'évasement démarre trop bas, la marche devient difficile ; si la matière est trop souple, la ligne perd son intention. Vérifiez les escaliers, la danse et la position assise avant de décider.</p>"
          princesse:
            title: Robe princesse
            body_html: "<p>La robe princesse repose sur un contraste net : buste ajusté, jupe volumineuse à partir de la taille naturelle ou parfois légèrement plus bas. Ce volume peut venir du tulle, de l'organza, de jupons ou de plusieurs épaisseurs de tissu.</p><p>Elle apporte une allure majestueuse en photos, mais le volume doit rester proportionné au lieu et à votre stature. Dans un petit espace, une jupe très ample peut être moins pratique ; dans un domaine ou une grande salle, elle prend mieux sa place.</p>"
          fourreau:
            title: Robe fourreau
            body_html: "<p>Ligne droite ou légèrement évasée, proche du corps sans être stretch moulant. Allure chic, moderne, souvent minimaliste.</p><p>Convient à celles qui aiment une silhouette épurée. Les matières fluides (crêpe) offrent plus de confort que le satin très structuré.</p>"
          bustier:
            title: Bustier et épaules
            body_html: "<p>Les bustiers structurent le haut du corps ; les bretelles larges ou manches ajoutent du soutien. Si vous avez des épaules fines, un décolleté structuré ou des manches peut équilibrer la silhouette.</p><p>En essayage, testez les bras levés et les embrassades : le maintien doit rester confortable toute la journée.</p>"
          essayage:
            title: Pourquoi l'essayage tranche
            body_html: '<p>La morphologie ne se résume pas à une lettre : longueur de buste, cambrure, préférences personnelles comptent autant. Nos conseillères à Cannes croisent votre ressenti et leur expertise pour proposer 6 à 8 modèles pertinents.</p><p>Consultez aussi le guide <a href="/fr/guides/comment-choisir-sa-robe-de-mariee">comment choisir sa robe</a> pour le style et le budget.</p>'
        faq:
          q1:
            question: Une morphologie peut-elle porter plusieurs coupes ?
            answer_html: "<p>Oui. Les guides sont des pistes, pas des interdictions. Seul l'essayage confirme ce qui vous met en valeur.</p>"
          q2:
            question: La robe princesse grossit-elle la silhouette ?
            answer_html: "<p>Le volume part de la taille : bien choisi, il structure sans alourdir. La hauteur de ceinture et le décolleté font la différence.</p>"
          q3:
            question: Où essayer selon ma morphologie à Cannes ?
            answer_html: "<p>Autour D'Un Soir, 29 boulevard Carnot. Réservez un essayage pour une sélection ciblée.</p>"
      smoking_ou_costume_mariage:
        link_title: Smoking ou costume mariage
        header_title: Smoking ou costume de mariage ?
        header_subtitle: Le bon choix selon l'occasion
        intro_html: <p>Le choix entre smoking et costume vient de deux traditions différentes. Le smoking appartient aux codes du soir et du black tie ; le costume reste plus souple, adapté aux cérémonies de jour, aux mariages civils et aux événements moins formels.</p><p>Le dress code, l'heure et le lieu — église, plage, domaine, soirée — orientent donc la décision. En boutique à Cannes, nous proposons les deux, en location ou vente, avec essayage. Pour les formules location, voir <a href="/fr/guides/location-smoking-costume-cannes">location smoking Cannes</a> et <a href="/fr/costume-mariage-cannes">costumes mariage</a>.</p>
        sections:
          smoking:
            title: Quand choisir le smoking ?
            body_html: "<p>Mariage en soirée, réception black tie, gala ou cérémonie très habillée : le smoking est la référence. Il se distingue du costume par ses détails satinés ou gros-grain sur le revers, la ligne du pantalon et l'association traditionnelle avec chemise blanche et nœud papillon.</p><p>Le noir reste le grand classique. Le midnight blue est aussi utilisé dans les tenues de soirée, car il peut garder davantage de profondeur sous certaines lumières artificielles. Essayez les deux en cabine selon le contexte réel de l'événement.</p>"
          costume:
            title: Quand choisir le costume ?
            body_html: "<p>Mariage civil, cérémonie en journée, jardin ou ambiance smart chic : le costume trois pièces bleu, beige, gris ou vert bouteille offre plus de liberté. La cravate allonge la silhouette ; le nœud papillon donne une note plus cérémonielle.</p><p>Le costume a aussi un avantage pratique : il se réutilise plus facilement pour d'autres événements professionnels ou familiaux. La qualité de l'ajustement reste essentielle : épaules nettes, longueur de manche correcte, pantalon bien cassé sur la chaussure.</p>"
          accessoires:
            title: Accessoires et cohérence
            body_html: "<p>Pochette, ceinture, boutons de manchette, montre discrète : les détails unifient la tenue. Harmonisez avec les couleurs du cortège et de la mariée si vous êtes témoin.</p><p>Tout est coordonné en boutique — pas besoin d'acheter ailleurs sans essayage.</p>"
          location:
            title: Louer ou acheter ?
            body_html: "<p>Pour un mariage unique, la location sur 4 jours est économique ; notre atelier ajuste la tenue pour un port parfait. Pour plusieurs événements par an, l'achat peut être rentable.</p><p>Nos conseillers comparent les deux sans vous pousser vers l'option la plus chère.</p>"
        faq:
          q1:
            question: Un témoin doit-il porter le même style que le marié ?
            answer_html: "<p>Pas obligatoirement identique, mais harmonisé : même niveau de formalité (smoking vs costume) et couleurs complémentaires.</p>"
          q2:
            question: Smoking obligatoire pour un mariage en soirée ?
            answer_html: "<p>Si le dress code est black tie, oui. Sinon un costume très habillé foncé peut suffire — vérifiez avec les mariés.</p>"
          q3:
            question: Où essayer smoking et costume à Cannes ?
            answer_html: "<p>Autour D'Un Soir, 29 boulevard Carnot, sur rendez-vous.</p>"
      robe_invitee_mariage:
        link_title: Robe invitée mariage
        header_title: Tenue invitée de mariage
        header_subtitle: Élégante sans voler la vedette
        intro_html: '<p>Invitée à un mariage, vous cherchez l''équilibre entre élégance et discrétion : éviter le blanc et les tons trop proches de la mariée, tout en assumant votre style. Robe cocktail, longue ou ensemble chic : le dress code de l''invitation est votre première référence.</p><p>À Cannes, Autour D''Un Soir propose robes courtes et longues en <strong>location ou vente</strong>, avec essayage. Voir aussi <a href="/fr/guides/achat-ou-location-tenue-soiree">achat ou location</a> et <a href="/fr/guides/chaussures-accessoires-soiree">accessoires</a>.</p>'
        sections:
          dresscode:
            title: Lire le dress code
            body_html: "<p><strong>Champêtre</strong> : robes fluides, fleuries, longueurs midi. <strong>Chic</strong> : cocktail ou longue sobre. <strong>Black tie</strong> : longue obligatoire pour les soirées très habillées.</p><p>En cas de doute, une robe midi élégante dans une couleur profonde (bleu, vert, bordeaux) reste un choix sûr. Demandez aux mariés si un thème couleur est imposé.</p>"
          couleurs:
            title: Couleurs et pièges à éviter
            body_html: "<p>Blanc, ivoire et écru sont réservés à la mariée. Les pastels très clairs peuvent aussi prêter à confusion sur les photos. Privilégiez couleurs soutenues ou imprimés floraux discrets.</p><p>Pour un mariage en soirée sur la Côte d'Azur, les matières légères avec un châle ou boléro pour la fraîcheur sont judicieuses.</p>"
          location:
            title: Louer ou acheter ?
            body_html: "<p>La location sur 4 jours convient si vous portez la tenue une ou deux fois. L'achat se justifie pour plusieurs mariages ou galas dans l'année.</p><p>Essayage en boutique : vous validez longueur, confort assis et harmonie avec vos chaussures.</p>"
          accessoires:
            title: Chaussures et finitions
            body_html: <p>Talons stables pour danser, pochette ou clutch assortie, bijoux sobres. Testez la tenue complète en cabine.</p><p>Notre guide <a href="/fr/guides/chaussures-accessoires-soiree">chaussures et accessoires</a> détaille la coordination du look.</p>
        faq:
          q1:
            question: Puis-je porter du noir en tant qu'invitée ?
            answer_html: "<p>Oui, sauf indication contraire des mariés. Le noir est élégant pour une soirée.</p>"
          q2:
            question: Robe longue ou cocktail ?
            answer_html: "<p>Selon le dress code et l'heure : cocktail pour un après-midi, longue souvent pour le soir ou black tie.</p>"
          q3:
            question: Où louer une robe d'invitée à Cannes ?
            answer_html: "<p>Autour D'Un Soir, 29 boulevard Carnot, sur rendez-vous avec essayage.</p>"
      tenue_gala_ceremonie:
        link_title: Tenue gala & cérémonie
        header_title: Tenue de gala et cérémonie
        header_subtitle: Galas, baptêmes, remises de diplômes et soirées habillées
        intro_html: '<p>Galas, baptêmes, remises de diplômes ou soirées pendant le Festival de Cannes : chaque occasion a son niveau de formalité. Une tenue réussie respecte le code sans être ostentatoire, car l''élégance dépend autant du contexte que de la pièce portée.</p><p>Les codes de soirée viennent d''une longue tradition mondaine : robe longue pour les événements les plus habillés, smoking pour le black tie, cocktail pour les moments moins protocolaires. Comparez <a href="/fr/guides/robe-invitee-mariage">tenue invitée</a> pour les mariages et <a href="/fr/guides/location-smoking-costume-cannes">location smoking</a> pour les hommes.</p>'
        sections:
          femmes:
            title: Pour les femmes
            body_html: "<p><strong>Gala / black tie</strong> : robe longue, matières nobles (soie, satin, crêpe), bijoux discrets. <strong>Cocktail habillé</strong> : midi ou courte sophistiquée. <strong>Baptême chic</strong> : couleurs pastel ou imprimés élégants, éviter le blanc pur si la famille le réserve.</p><p>Le satin reflète davantage la lumière, le crêpe donne un rendu plus mat, le tulle apporte du volume. En cabine, vérifiez le confort assis, la longueur avec vos chaussures et le comportement de la matière sous une lumière forte.</p>"
          hommes:
            title: Pour les hommes
            body_html: "<p>Smoking pour black tie ; costume trois pièces pour cocktail habillé ou gala moins strict. Chaussures vernies ou richelieu, pochette et nœud papillon coordonnés.</p><p>Pendant le Festival de Cannes, anticipez la réservation : forte demande en mai.</p>"
          occasions:
            title: Quelles occasions couvrir ?
            body_html: "<p>Baptêmes, communions, galas caritatifs, soirées d'entreprise, remises de prix, dîners sur la Croisette : nous couvrons l'essentiel des dress codes de la région.</p><p>Location 4 jours ou achat selon fréquence d'utilisation — nos conseillers vous orientent.</p>"
          festival:
            title: Festival de Cannes et événements prestige
            body_html: "<p>Montées de marches et soirées privées exigent une tenue très lisible : ligne nette, longueur maîtrisée, accessoires cohérents. Les flashs accentuent les reflets, les plis et les transparences ; une matière magnifique en lumière douce peut réagir différemment en photo.</p><p>Le Festival concentre beaucoup de demandes en mai : mieux vaut anticiper les essayages, surtout pour les smokings, robes longues et retouches de dernière minute.</p>"
        faq:
          q1:
            question: Quelle différence entre tenue de gala et tenue de cocktail ?
            answer_html: "<p>Le gala ou black tie appelle une robe longue ou un smoking. Le cocktail autorise une robe mi-longue ou courte plus audacieuse, ou un costume avec cravate pour les hommes.</p>"
          q2:
            question: Peut-on louer une tenue pour un gala à Cannes ?
            answer_html: "<p>Oui, robes et smokings sont disponibles à la location en boutique, avec essayage et ajustement en atelier pour une tenue parfaitement adaptée. Idéal pour un événement ponctuel sur la Riviera.</p>"
      achat_ou_location_tenue_soiree:
        link_title: Achat ou location tenue de soirée
        header_title: Achat ou location de tenue de soirée ?
        header_subtitle: Le guide pour faire le bon choix
        intro_html: "<p>Invitée à un mariage, gala, soirée d'entreprise ou Festival de Cannes : faut-il louer ou acheter sa tenue ? La réponse dépend de la fréquence, du budget et de l'envie de garder une pièce signature.</p><p>Chez Autour D'Un Soir, robes de soirée, smokings et costumes sont disponibles en <strong>location (4 jours)</strong> ou en vente — robes de mariée en vente uniquement. Essayage en boutique à Cannes.</p>"
        sections:
          location:
            title: Les avantages de la location
            body_html: "<p>Accédez à des tenues haut de gamme pour un budget maîtrisé. Entretien et pressing inclus dans notre prestation. Idéal pour un événement ponctuel ou une taille que vous ne porterez plus.</p><p>Formule standard : retrait 2 jours avant, retour 2 jours après. Caution au retrait, acompte de 30 % à la réservation.</p>"
          achat:
            title: Les avantages de l'achat
            body_html: "<p>Investissement pertinent si vous assistez à plusieurs mariages ou galas par an, ou si vous souhaitez une pièce modifiable (retouches répétées).</p><p>L'achat permet aussi de choisir une coupe parfaitement ajustée à votre morphologie, sans contrainte de date de retour.</p>"
          comparatif:
            title: Tableau de décision rapide
            body_html: "<p><strong>Louez</strong> si : un seul événement, budget serré, envie de variété. <strong>Achetez</strong> si : événements récurrents, tenue de référence, retouches personnalisées importantes.</p><p>En cas de doute, nos conseillers comparent le coût total (location répétée vs achat) lors de l'essayage.</p>"
          boutique:
            title: Essayage à Cannes
            body_html: <p>La location et l'achat se font en boutique, pas en ligne — pour valider taille, confort et style. 29 boulevard Carnot.</p><p>Voir <a href="/fr/guides/location-smoking-costume-cannes">location smoking</a> pour les hommes et <a href="/fr/guides/robe-invitee-mariage">robe invitée</a> pour les femmes.</p>
        faq:
          q1:
            question: Peut-on louer en ligne ?
            answer_html: "<p>Non. Location et essayage en boutique à Cannes uniquement, pour ajuster la tenue à votre morphologie.</p>"
          q2:
            question: Quelle durée de location ?
            answer_html: "<p>4 jours standard : retrait 2 jours avant l'événement, retour 2 jours après.</p>"
          q3:
            question: Peut-on louer une robe de mariée ?
            answer_html: "<p>Non. Les robes de mariée sont vendues en boutique. La location concerne tenues de soirée, smokings et costumes.</p>"
      location_smoking_costume_cannes:
        link_title: Location smoking & costume
        header_title: Location smoking et costume à Cannes
        header_subtitle: Essayage, retouches et formules location en boutique
        intro_html: '<p>Pour un mariage, un gala ou le Festival de Cannes, louer un smoking ou un costume permet d''adapter précisément la tenue à un événement donné : niveau de formalité, heure, lieu, saison, photos. L''enjeu n''est pas seulement la taille, mais la cohérence du vêtement complet.</p><p>Notre formule standard couvre 4 jours (retrait avant l''événement, retour après). Pour comprendre les différences de codes, comparez avec notre guide <a href="/fr/guides/achat-ou-location-tenue-soiree">achat ou location</a> et le comparatif <a href="/fr/guides/smoking-ou-costume-mariage">smoking ou costume</a>.</p>'
        sections:
          formules:
            title: Nos formules de location
            body_html: '<p>La location standard est de <strong>4 jours</strong> : retrait 2 jours avant votre événement, retour 2 jours après (comme sur notre <a href="/fr/faq">FAQ</a>). L''essayage a lieu avant le retrait ; notre atelier ajuste la tenue pour qu''elle vous corresponde parfaitement le jour J.</p><p>Smokings (noir, midnight blue), costumes trois pièces, pantalons et vestes de cérémonie, ainsi que nœuds papillon, ceintures et pochettes sont disponibles en boutique. Une caution proportionnelle à la valeur de la tenue est demandée au retrait.</p>'
          essayage:
            title: Essayage et ajustement en atelier
            body_html: "<p>Chaque location commence par un essayage : nous vérifions la taille aux épaules, la longueur de veste et de pantalon, le tombé de la chemise. Notre atelier réalise ensuite les retouches nécessaires (ourlets, pinces, manches) pour que la tenue vous corresponde parfaitement.</p><p>Prévoyez vos chaussures de cérémonie à l'essayage pour ajuster la longueur du pantalon. Le rendez-vous est recommandé, surtout en période du Festival de Cannes ou des mariages estivaux.</p>"
          occasions:
            title: Mariage, gala et événements
            body_html: "<p><strong>Mariage en soirée</strong> : smoking ou costume foncé selon le dress code. <strong>Mariage de jour</strong> : costume bleu, beige ou gris. <strong>Gala ou cérémonie</strong> : smoking black tie ou costume trois pièces.</p><p>Le vocabulaire compte : black tie implique normalement smoking et nœud papillon ; cocktail laisse plus de liberté ; cérémonie civile autorise souvent une tenue plus claire ou moins formelle. Pendant le Festival de Cannes, anticipez votre réservation pour les soirées et montées de marches.</p>"
          accessoires_homme:
            title: Accessoires et finitions
            body_html: "<p>Nœud papillon ou cravate, pochette, ceinture, boutons de manchette : ces détails donnent le niveau de formalité. Avec un smoking, la ceinture de smoking ou le gilet bas, le nœud papillon et les chaussures noires restent les repères les plus classiques.</p><p>Avec un costume, la cravate, la pochette et la couleur des chaussures peuvent assouplir ou habiller l'ensemble. L'important est de ne pas mélanger trop de registres dans une même tenue.</p>"
          enfants:
            title: Costumes pour enfants
            body_html: "<p>Garçons d'honneur, pages et enfants du cortège : tailles adaptées, coupes ajustées en atelier. Location ou vente selon les modèles.</p><p>Prévoir un essayage enfant en même temps que le vôtre permet de harmoniser les couleurs et le niveau de formalité de la famille.</p>"
          expertise:
            title: 'Location ou achat : notre conseil'
            body_html: "<p>La location convient à un événement ponctuel (mariage invité, gala, Festival). L'achat devient intéressant si vous portez régulièrement une tenue de cérémonie. Nos conseillers comparent les deux options sans vous orienter à la légère.</p><p>Depuis 1980 à Cannes, nous habillons mariés, témoins et invités : cette expertise guide nos recommandations sur la coupe, la couleur et les accessoires.</p>"
          acces:
            title: Boutique à Cannes
            body_html: '<p>29 boulevard Carnot, 5 minutes à pied de la gare de Cannes. En voiture : environ 30 min depuis Nice, 20 min depuis Antibes, 45 min depuis Monaco. Parkings publics à proximité.</p><p>Réservation en boutique avec acompte de 30 % pour confirmer la location. Découvrez aussi nos <a href="/fr/costume-mariage-cannes">costumes de mariage à Cannes</a>.</p>'
        faq:
          q1:
            question: Peut-on louer un smoking sans l'acheter ?
            answer_html: "<p>Oui. Smokings et costumes sont proposés en location en boutique, avec essayage et retouches en atelier pour un ajustement parfait.</p>"
          q2:
            question: Proposez-vous aussi la vente de costumes ?
            answer_html: "<p>Oui, location et vente sont possibles. Pour des événements répétés, l'achat peut être plus avantageux — nos conseillers vous orientent.</p>"
          q3:
            question: Smoking noir ou midnight blue ?
            answer_html: "<p>Le noir est le classique black tie. Le midnight blue photographie souvent mieux en soirée et sous les flashs. Essayez les deux en boutique selon votre événement.</p>"
          q4:
            question: Proposez-vous des costumes pour enfants en location ?
            answer_html: "<p>Oui, avec tailles enfants et retouches adaptées. Réservez un créneau d'essayage pour le coordonner avec la vôtre.</p>"
          q5:
            question: Que se passe-t-il en cas de retour tardif ?
            answer_html: "<p>Les dates de retrait et de retour sont fixées à la réservation. Un retard peut entraîner des frais complémentaires selon nos conditions de location en boutique.</p>"
      chaussures_accessoires_soiree:
        link_title: Chaussures & accessoires
        header_title: Chaussures et accessoires de soirée
        header_subtitle: Sublimer votre tenue de mariage, gala ou cérémonie
        intro_html: '<p>La robe ou le costume ne suffisent pas : chaussures, sac, bijoux et accessoires donnent le ton final à votre look. Un décalage de couleur ou une hauteur de talon mal choisie peut gâcher des photos pourtant réussies.</p><p>En boutique à Cannes, nous coordonnons chaque détail en cabine — mariage, gala ou soirée. Après avoir choisi votre tenue, voir <a href="/fr/guides/comment-choisir-sa-robe-de-mariee">choisir sa robe</a> ou <a href="/fr/guides/robe-invitee-mariage">tenue invitée</a> si besoin.</p>'
        cta_title: Compléter ma tenue en boutique
        sections:
          chaussures:
            title: Choisir ses chaussures
            body_html: "<p>Talons, escarpins, sandales ou mules : la hauteur influence la longueur de robe ou de pantalon. Prévoyez l'essayage <strong>avec</strong> votre tenue pour ajuster l'ourlet si besoin ; quelques centimètres changent le tombé d'une robe longue.</p><p>Hommes : richelieu, mocassins ou vernis selon smoking ou costume. Le soulier verni appartient aux codes les plus habillés ; un cuir lisse noir reste souvent plus polyvalent. Pensez aussi au sol : tapis, pavés, sable ou pelouse ne demandent pas la même stabilité.</p>"
          accessoires:
            title: Sacs, bijoux et finitions
            body_html: "<p>Clutch, pochette, ceinture, bijoux, châle ou boléro : chaque élément doit servir la silhouette, pas la surcharger. Pour un mariage, évitez les bijoux trop voyants qui rivalisent avec la mariée.</p><p>Sélection femme et homme en boutique pour mariage, gala et soirée.</p>"
          coordonner:
            title: Coordonner l'ensemble
            body_html: "<p>Palette cohérente : métal des bijoux (or ou argent), teinte des chaussures, ton du sac. Deux couleurs dominantes + un accent suffisent souvent. Les accessoires servent à créer un rappel, pas à ajouter une nouvelle idée à chaque détail.</p><p>Pensez aussi à la photographie : les matières brillantes captent les flashs, les pastels très clairs peuvent se rapprocher du blanc, les métaux trop mélangés donnent parfois une impression moins nette. La tenue complète doit rester lisible de près comme de loin.</p>"
          boutique:
            title: Retrouver nos collections à Cannes
            body_html: "<p>29 boulevard Carnot. Essayage sur place pour finaliser la tenue avant le jour J. Idéal en complément d'une robe choisie chez nous ou apportée pour harmonisation.</p>"
        faq:
          q1:
            question: Peut-on acheter ou louer chaussures et accessoires ?
            answer_html: "<p>Selon les articles, vente ou location en boutique. Notre équipe précise les options pour chaque modèle.</p>"
          q2:
            question: Dois-je apporter ma robe pour choisir mes chaussures ?
            answer_html: "<p>Fortement recommandé pour la longueur et les couleurs. Sinon, photo ou échantillon de tissu.</p>"
          q3:
            question: Quelle hauteur de talon pour une robe longue ?
            answer_html: "<p>Celle que vous tiendrez toute la soirée. En essayage, nous ajustons l'ourlet en conséquence.</p>"
      histoire_autour_dun_soir_cannes:
        link_title: Histoire de la boutique
        header_title: L'histoire d'Autour D'Un Soir à Cannes
        header_subtitle: Une adresse de mode, d'atelier et d'événementiel
        intro_html: '<p>Depuis 1980, Autour D''Un Soir construit son savoir-faire autour de la garde-robe événementielle, des costumes et de l''atelier de retouches. À Cannes, la ville vit au rythme du cinéma, des galas et des mariages sur la Riviera — un univers où l''essayage, le choix des matières et l''ajustement comptent autant que le style.</p><p>Cette philosophie n''a pas changé : accompagner chaque client avec exigence, que ce soit pour un mariage, une soirée, une production audiovisuelle ou une reconstitution historique. Découvrez aussi notre page <a href="/fr/robe-de-mariee-cannes">robes de mariée à Cannes</a>.</p>'
        sections:
          origines:
            title: Les débuts en 1980
            body_html: "<p>Les années 80 marquent un tournant visible dans la mode événementielle : silhouettes affirmées, épaules plus présentes, goût des matières brillantes et robes de mariée parfois très volumineuses. Dans le même temps, Cannes continue d'associer cinéma, soirées privées et événements de prestige.</p><p>Dans cet univers, la tenue n'est pas seulement fonctionnelle : elle est liée à un moment public, photographié, partagé. Cette culture de l'événement explique l'importance donnée au choix, à l'essayage et à l'ajustement.</p>"
          evolution:
            title: Quatre décennies de métier
            body_html: "<p>Au fil des saisons, nous avons vu passer les volumes des robes princesse, le retour du minimalisme, l'essor du bohème et la demande croissante pour des tenues de cinéma et de télévision. Ces changements suivent aussi l'évolution des usages : mariages civils plus fréquents, cérémonies en extérieur, soirées professionnelles, productions audiovisuelles plus mobiles.</p><p>L'atelier s'est imposé comme un pilier, car une robe ou un costume ne se résume pas à une taille indiquée sur une étiquette. Ourlet, buste, manche, tombé de veste : ce sont ces détails qui transforment un vêtement disponible en boutique en tenue adaptée à une personne et à une occasion.</p>"
          cannes:
            title: Cannes et la Côte d'Azur
            body_html: "<p>Notre ville n'est pas un simple décor : le Festival, les mariages en bord de mer, les galas d'entreprise et les tournages façonnent notre quotidien. Nous connaissons les contraintes réelles — chaleur estivale, vent en bord de mer, escaliers de domaines provençaux — et nous les intégrons dans nos conseils.</p><p>Cette ancrage local nourrit notre regard : nous savons ce qui fonctionne sur la Riviera, en cabine comme sur un plateau de tournage.</p>"
          aujourdhui:
            title: 'Aujourd''hui : une maison, plusieurs métiers'
            body_html: '<p>Robes de mariée, location de soirée, costumes d''époque, prestations entreprises, habillage audiovisuel : Autour D''Un Soir est devenu une référence polyvalente. Ce qui unit ces activités, c''est le textile, la coupe et l''écoute.</p><p>Pour en savoir plus sur l''équipe et l''atelier, lisez notre guide sur <a href="/fr/guides/metier-couturiere-retouches">le métier de couturière</a> ou visitez <a href="/fr/la_boutique">la boutique</a>.</p>'
        faq:
          q1:
            question: Depuis quand Autour D'Un Soir existe-t-il ?
            answer_html: "<p>L'histoire d'Autour D'Un Soir commence en 1980. Aujourd'hui, la boutique vous accueille au 29 boulevard Carnot à Cannes.</p>"
          q2:
            question: Quelles activités la boutique propose-t-elle ?
            answer_html: "<p>Robes de mariée (vente), tenues de soirée (location et vente), costumes, costumes d'époque, retouches atelier et prestations pour entreprises et audiovisuel.</p>"
          q3:
            question: La boutique accueille-t-elle uniquement les mariées ?
            answer_html: "<p>Non. Nous accompagnons aussi les soirées, galas, productions cinéma/TV et événements d'entreprise.</p>"
      metier_couturiere_retouches:
        link_title: Métier de couturière
        header_title: Le métier de couturière en boutique
        header_subtitle: Coulisses de l'atelier Autour D'Un Soir
        intro_html: "<p>Derrière chaque robe ajustée ou costume retouché, il y a des mains expertes. À Autour D'Un Soir, l'atelier n'est pas un service annexe : c'est le cœur du métier. Sophie, Sandra et l'équipe couture transforment un vêtement standard en une pièce qui épouse vraiment votre silhouette.</p><p>Ce guide vous emmène dans les coulisses : gestes, étapes et raisons pour lesquelles la couture fait toute la différence, notamment pour une robe de mariée.</p>"
        sections:
          atelier:
            title: L'atelier au quotidien
            body_html: "<p>Ourlets, pinces, bretelles, traînes, doublures : chaque retouche commence par une observation minutieuse en cabine. La couturière note les points de tension, la posture et la longueur réelle en mouvement — pas seulement face au miroir.</p><p>Techniquement, une retouche réussie respecte la construction du vêtement : sens du tissu, doublure, baleines, fermeture, broderie ou motif de dentelle. Cette étape est discrète pour le client final, mais elle détermine le confort et l'élégance le jour J.</p>"
          gestes:
            title: Les gestes qui comptent
            body_html: "<p>Repiquer un buste sans déformer une dentelle, raccourcir une traîne en préservant le tombé, ajuster une manche pour qu'elle suive le bras en dansant : ce sont des gestes précis, appris sur des années de pratique.</p><p>La difficulté varie selon la matière. Le satin marque facilement les points de tension, le tulle demande de la patience sur les épaisseurs, la dentelle impose souvent de replacer un motif à la main. C'est ce savoir-faire textile qui donne un rendu propre sans que la retouche se voie.</p>"
          mariage:
            title: Pourquoi c'est crucial pour le mariage
            body_html: '<p>Une robe de mariée achetée sans retouche reste rarement parfaite : les morphologies sont uniques, et les modèles de série sont conçus pour une taille standard. C''est pourquoi nous vendons les robes de mariée en boutique avec un accompagnement atelier complet.</p><p>En savoir plus sur <a href="/fr/guides/savoir-faire-retouches-robe-mariee">le savoir-faire des retouches mariée</a>.</p>'
        faq:
          q1:
            question: Qui réalise les retouches chez Autour D'Un Soir ?
            answer_html: "<p>Notre équipe de couturières en atelier, avec Sophie et Sandra parmi les références de la maison.</p>"
          q2:
            question: Les retouches sont-elles incluses ?
            answer_html: "<p>Pour les robes de mariée vendues en boutique, les retouches font partie de l'accompagnement. Pour la location de soirée, des ajustements mineurs sont également prévus.</p>"
          q3:
            question: Combien de passages en atelier prévoir ?
            answer_html: "<p>En général deux à trois rendez-vous pour une robe de mariée : prise de mesures, essayage intermédiaire et contrôle final.</p>"
      savoir_faire_retouches_robe_mariee:
        link_title: Retouches robe de mariée
        header_title: Le savoir-faire des retouches sur robe de mariée
        header_subtitle: Pourquoi l'atelier change tout
        intro_html: "<p>Acheter une robe de mariée, ce n'est pas seulement choisir un modèle : c'est un parcours d'ajustement. Buste, longueur, bretelles, traîne — chaque détail influence le rendu final et votre confort pendant des heures.</p><p>Chez Autour D'Un Soir à Cannes, nous expliquons ce travail en toute transparence, pour que vous compreniez pourquoi l'essayage et l'atelier sont indissociables d'une robe réussie.</p>"
        sections:
          buste:
            title: Buste et maintien
            body_html: "<p>Le buste doit soutenir sans comprimer. Sur une robe bustier ou dos nu, quelques millimètres de différence transforment le tombé : trop large, la robe glisse ; trop serrée, elle marque la peau et limite la respiration.</p><p>Les robes structurées utilisent souvent pinces, baleines, doublures ou renforts internes. Les retouches doivent préserver cette architecture, surtout quand le dos est ouvert ou que la dentelle laisse moins de marge de correction.</p>"
          longueur:
            title: Longueur et ourlet
            body_html: "<p>L'ourlet se décide avec vos chaussures du jour J, sur un sol proche de celui de la cérémonie. Une robe longue doit effleurer sans faire trébucher ; un pantalon de costume doit casser correctement sur la chaussure.</p><p>En extérieur sur la Riviera, nous anticipons aussi le terrain : herbe, sable, dalles ou escaliers. Une longueur spectaculaire en boutique peut devenir moins pratique si la cérémonie se déroule dehors ou si la soirée prévoit beaucoup de déplacements.</p>"
          traine:
            title: Traîne et mouvement
            body_html: "<p>Une traîne spectaculaire demande un équilibre entre esthétique et praticité. Nous pouvons prévoir des systèmes d'accroche pour la soirée, ou raccourcir légèrement pour faciliter la danse.</p>"
        faq:
          q1:
            question: Pourquoi ne pas acheter une robe sans retouches ?
            answer_html: "<p>Les tailles standard ne correspondent rarement à 100 % d'une morphologie. Sans retouche, la robe peut glisser, tirer ou marquer aux mauvais endroits.</p>"
          q2:
            question: Quand commencer les retouches ?
            answer_html: "<p>Après le choix du modèle, idéalement 2 à 3 mois avant le mariage pour laisser le temps des passages en atelier.</p>"
          q3:
            question: Où se déroule l'essayage à Cannes ?
            answer_html: <p>Chez Autour D'Un Soir, 29 boulevard Carnot. Voir la page <a href="/fr/essayage-robe-de-mariee-cannes">essayage robe de mariée</a>.</p>
      costumes_epoque_histoire_mode:
        link_title: Costumes d'époque
        header_title: 'Costumes d''époque : voyage dans l''histoire'
        header_subtitle: De la Renaissance aux années 80
        intro_html: "<p>Chaque époque a sa silhouette, ses matières et ses codes. Chez Autour D'Un Soir, notre collection de costumes historiques sert le théâtre, le cinéma, les reconstitutions et les mariages à thème — mais aussi la curiosité de celles et ceux qui veulent comprendre comment la mode raconte l'histoire.</p><p>Ce guide est une invitation au voyage vestimentaire, sans prétention académique : nous partageons ce que quarante ans de costumes nous ont appris.</p>"
        sections:
          periodes:
            title: Les grandes périodes
            body_html: "<p>Renaissance, XVIIIe siècle, époque napoléonienne, Belle Époque, années folles, mid-century, seventies et eighties : chaque période a ses volumes, ses couleurs et ses accessoires. La Renaissance joue volontiers sur les manches, les brocarts et les silhouettes construites ; le XVIIIe siècle met l'accent sur les paniers, les habits brodés et les perruques ; les années 20 raccourcissent et fluidifient les lignes.</p><p>Un costume crédible repose sur ces détails, pas seulement sur une « ambiance » générale. Même pour un événement non académique, choisir deux ou trois repères justes évite l'effet déguisement.</p>"
          matieres:
            title: Matières et finitions
            body_html: "<p>Broderies, dentelles, boutons, coiffes et chapeaux complètent la silhouette. Les accessoires sont souvent ce qui rend une époque reconnaissable : une coiffe, une cravate, une ganse, une paire de gants ou un bijou orientent immédiatement la lecture.</p><p>La cohérence passe aussi par les matières. Un tissu trop contemporain, trop brillant ou trop extensible peut casser l'illusion historique, même si la coupe générale paraît correcte.</p>"
          usages:
            title: Théâtre, cinéma et mariages thématiques
            body_html: <p>Nos costumes d'époque servent des productions scéniques, des tournages et des événements privés. Pour un mariage à thème, voir aussi <a href="/fr/guides/costume-epoque-mariage-theme">mariage d'époque</a> ou nos <a href="/fr/nos_autres_activites">autres activités</a>.</p>
        faq:
          q1:
            question: Peut-on louer un costume d'époque ?
            answer_html: "<p>Oui, selon les pièces et les dates. Contactez la boutique pour un projet précis.</p>"
          q2:
            question: Proposez-vous des costumes sur mesure ?
            answer_html: "<p>Oui, notre atelier réalise des créations et répliques sur mesure pour des projets spécifiques.</p>"
          q3:
            question: Quelles périodes sont disponibles ?
            answer_html: "<p>De la Renaissance aux années 80, avec un stock évolutif. La boutique vous oriente selon votre projet.</p>"
      costume_epoque_mariage_theme:
        link_title: Mariage à thème d'époque
        header_title: Organiser un mariage à thème d'époque
        header_subtitle: Cohérence historique et élégance
        intro_html: "<p>Un mariage costumé peut être magique — à condition de viser la cohérence plutôt que le déguisement. L'époque choisie, le lieu, la lumière et le niveau de fidélité historique doivent dialoguer.</p><p>Autour D'Un Soir accompagne régulièrement des projets de mariage thématique sur la Côte d'Azur : voici nos conseils pour avancer sereinement.</p>"
        sections:
          choix:
            title: Choisir une époque
            body_html: "<p>Belle Époque, années 20, Renaissance : chaque choix implique des contraintes différentes pour les invités. La Belle Époque évoque robes longues, corsages, chapeaux et élégance de promenade ; les années 20 privilégient lignes plus droites, perles, franges et coiffures courtes ; la Renaissance demande des volumes plus théâtraux.</p><p>Mieux vaut une direction claire et quelques références visuelles partagées qu'un thème trop vague. Un thème « ancien » sans période précise produit souvent un mélange difficile à harmoniser sur les photos.</p>"
          coherence:
            title: Cohérence des silhouettes
            body_html: "<p>Mariée, marié, témoins et invités : définissez un niveau d'exigence commun. Vous pouvez viser une inspiration historique souple ou une reconstitution plus stricte, mais il faut le décider avant les essayages.</p><p>Un costume d'époque très fidèle à côté d'une tenue moderne peut créer un décalage sur les photos. À l'inverse, une palette de couleurs cohérente, quelques accessoires bien choisis et des silhouettes compatibles suffisent parfois à créer l'atmosphère sans contraindre tous les invités.</p>"
          boutique:
            title: Le rôle de la boutique
            body_html: <p>Nous conseillons sur les pièces disponibles, les retouches nécessaires et la faisabilité selon la date. Découvrez notre collection sur <a href="/fr/guides/costumes-epoque-histoire-mode">costumes d'époque</a>.</p>
        faq:
          q1:
            question: Peut-on combiner robe moderne et thème d'époque ?
            answer_html: "<p>Oui, avec une direction esthétique claire — par exemple une robe contemporaine inspirée d'une époque plutôt qu'une reconstitution stricte.</p>"
          q2:
            question: Faut-il prévenir les invités longtemps à l'avance ?
            answer_html: "<p>Oui, surtout s'ils doivent se procurer ou louer des tenues spécifiques.</p>"
          q3:
            question: La boutique habille-t-elle aussi le marié ?
            answer_html: "<p>Oui, costumes, smokings et costumes d'époque pour hommes sont disponibles en boutique.</p>"
      costumes_cinema_television_cannes:
        link_title: Costumes cinéma & TV
        header_title: Habiller le cinéma et la télévision
        header_subtitle: Le métier du costume sur la Côte d'Azur
        intro_html: "<p>Cannes vit au rythme des images : Festival, tournages, clips et publicités. Habiller une production, c'est comprendre le personnage, la lumière, les mouvements de caméra et les contraintes de temps.</p><p>Autour D'Un Soir collabore depuis des décennies avec le monde audiovisuel. Ce guide explique ce métier de coulisse, souvent invisible mais essentiel à la crédibilité d'une image.</p>"
        sections:
          role:
            title: Le rôle du costumier
            body_html: "<p>Le costumier traduit une époque, un statut social, une personnalité. Une veste trop neuve, une robe trop actuelle ou une couleur mal choisie peuvent contredire le personnage avant même qu'il parle.</p><p>Le travail est aussi logistique : anticiper les retouches entre les prises, prévoir des doublons si une scène salit ou abîme une tenue, adapter le vêtement aux mouvements de caméra et aux raccords. Le costume doit raconter quelque chose tout en supportant les contraintes du plateau.</p>"
          cannes:
            title: Cannes, ville de tournage
            body_html: "<p>La Riviera attire des productions variées grâce à ses décors : bord de mer, hôtels, villas, rues anciennes, ports et lieux associés au Festival. Cannes concentre aussi une culture de l'image qui rend les demandes parfois très rapides.</p><p>Dans ce contexte, un stock varié est utile parce qu'un tournage peut avoir besoin d'une silhouette contemporaine, d'un smoking, d'une robe de gala ou d'un costume d'époque dans des délais courts. La disponibilité ne suffit pas : il faut aussi que la pièce fonctionne à l'écran.</p>"
          stock:
            title: Un stock pensé pour l'image
            body_html: '<p>Costumes d''époque, smokings, robes de soirée, uniformes : la diversité permet de couvrir des silhouettes et des styles variés. Découvrez aussi <a href="/fr/nos_autres_activites">nos prestations entreprises et audiovisuelles</a>.</p>'
        faq:
          q1:
            question: La boutique prête des costumes pour des tournages ?
            answer_html: "<p>Oui, sur devis selon le projet, les dates et les pièces nécessaires.</p>"
          q2:
            question: Intervenez-vous uniquement à Cannes ?
            answer_html: "<p>Notre base est à Cannes, mais nous accompagnons des productions sur la Côte d'Azur.</p>"
          q3:
            question: Proposez-vous des retouches express ?
            answer_html: "<p>Oui, l'atelier peut intervenir rapidement pour des ajustements entre les prises ou avant un événement.</p>"
      habiller_evenement_entreprise_gala:
        link_title: Gala & entreprise
        header_title: Habiller un gala ou un événement d'entreprise
        header_subtitle: Coulisses d'une prestation groupe
        intro_html: "<p>Galas, remises de prix, soirées corporate, cortèges : habiller un groupe demande logistique, cohérence visuelle et réactivité. Ce n'est pas qu'une question de tailles : il faut anticiper les délais, les essayages et l'image globale de l'événement.</p><p>Autour D'Un Soir accompagne régulièrement des entreprises et organisateurs sur la Riviera. Voici comment nous structurons ce type de projet.</p>"
        sections:
          preparation:
            title: Préparer un habillage groupe
            body_html: "<p>Nous commençons par comprendre le dress code, le nombre de personnes, les délais et le budget. Un devis sur mesure précise les pièces, les retouches et les dates de retrait.</p>"
          logistique:
            title: Logistique et essayages
            body_html: "<p>Pour un groupe, nous planifions des créneaux d'essayage échelonnés ou des sélections par taille. L'objectif : que chaque participant se sente à l'aise, pas seulement « habillé correctement ».</p>"
          image:
            title: Cohérence visuelle
            body_html: '<p>Smokings identiques, robes longues harmonisées, accessoires coordonnés : l''ensemble raconte l''événement sur scène et en photo. Voir aussi <a href="/fr/guides/tenue-gala-ceremonie">tenue de gala</a>.</p>'
        faq:
          q1:
            question: Proposez-vous des tarifs groupés ?
            answer_html: "<p>Oui, des conditions adaptées sont possibles selon le volume et la durée de location.</p>"
          q2:
            question: Peut-on habiller un cortège de mariage ?
            answer_html: "<p>Oui, nous accompagnons régulièrement témoins, parents et invités pour des mariages sur la Côte d'Azur.</p>"
          q3:
            question: Comment demander un devis ?
            answer_html: <p>Contactez la boutique par téléphone ou via le <a href="/fr/contact">formulaire de contact</a>.</p>
      histoire_robe_de_mariee_traditions:
        link_title: Histoire robe de mariée
        header_title: Histoire de la robe de mariée
        header_subtitle: Traditions, symboles et évolution
        intro_html: "<p>La robe blanche n'a pas toujours été la norme. Pendant des siècles, les mariées portaient leur plus belle robe — souvent colorée — et le blanc s'est imposé progressivement comme symbole de pureté et de statut social.</p><p>Comprendre cette histoire éclaire nos choix actuels : pourquoi nous sommes attachés à certaines silhouettes, et comment la robe de mariée continue d'évoluer.</p>"
        sections:
          origines:
            title: Origines et symboles
            body_html: "<p>Dans l'Antiquité et le Moyen Âge, la robe de noces signale souvent la richesse de la famille plus qu'un style unique. Les mariées portent fréquemment leur plus belle robe, parfois colorée, avec des matières et ornements qui indiquent leur rang social.</p><p>Dans les usages occidentaux, le blanc se généralise progressivement au XIXe siècle, notamment après le mariage de la reine Victoria en 1840. Il devient ensuite un symbole fortement associé à la mariée, même si l'ivoire, le champagne et d'autres nuances restent très présents.</p>"
          couleurs:
            title: Couleurs et cultures
            body_html: "<p>Rouge dans plusieurs traditions asiatiques, bleu associé à la fidélité dans certains usages européens anciens, blanc dans l'imaginaire occidental moderne : le mariage reste un rituel culturel avant d'être une simple question de mode.</p><p>Aujourd'hui, ivoire, champagne, nude, blush ou touches colorées côtoient le blanc pur. Ces nuances changent le rendu sur la peau et en photo : un blanc optique peut paraître très lumineux, tandis qu'un ivoire adoucit souvent le contraste.</p>"
          moderne:
            title: La mariée contemporaine
            body_html: '<p>Deuxième mariage, mariage civil, robe courte, costume : les codes se libèrent. En boutique à Cannes, nous accompagnons cette diversité. Voir <a href="/fr/guides/comment-choisir-sa-robe-de-mariee">comment choisir sa robe</a>.</p>'
        faq:
          q1:
            question: La robe doit-elle être blanche ?
            answer_html: "<p>Non. Ivoire, champagne ou couleur sont tout à fait possibles selon votre style et votre cérémonie.</p>"
          q2:
            question: Quand le blanc est-il devenu populaire ?
            answer_html: "<p>Surtout à partir du XIXe siècle en Europe, avec l'influence de la mode royale et bourgeoise.</p>"
          q3:
            question: Où essayer une robe à Cannes ?
            answer_html: <p>Chez Autour D'Un Soir. Page <a href="/fr/robe-de-mariee-cannes">robe de mariée Cannes</a>.</p>
      se_marier_cote_azur_lieux_saisons:
        link_title: Mariage Côte d'Azur
        header_title: Se marier sur la Côte d'Azur
        header_subtitle: Lieux, saisons et ambiances
        intro_html: "<p>La Riviera offre une palette unique : mer, pins parasols, domaines de Provence, villas Belle Époque et lumière méditerranéenne. Chaque décor suggère une ambiance — et une tenue.</p><p>Ce guide informatif vous aide à imaginer votre mariage sur la Côte d'Azur, sans liste de prestataires : seulement la logique des saisons, des lieux et des styles vestimentaires.</p>"
        sections:
          lieux:
            title: Lieux emblématiques
            body_html: "<p>Cannes et ses alentours : bord de mer, collines, domaines oléicoles, villas historiques. Nice et Monaco complètent l'éventail pour des mariages plus urbains ou glamour.</p>"
          saisons:
            title: Les saisons sur la Riviera
            body_html: "<p>Printemps doux, été lumineux et venté, automne doré : chaque saison a ses avantages. L'été demande des matières respirantes ; le printemps permet des traînes plus généreuses sans chaleur excessive.</p>"
          tenue:
            title: Tenue et décor
            body_html: <p>Un mariage en plein air sur la Côte d'Azur oriente souvent vers des robes fluides, des tissus légers et des chaussures adaptées au terrain. En boutique, nous intégrons ces contraintes dès l'essayage. Voir <a href="/fr/robe-de-mariee-cannes">robes de mariée à Cannes</a>.</p>
        faq:
          q1:
            question: Quelle est la meilleure saison pour se marier sur la Riviera ?
            answer_html: "<p>Le printemps et l'automne offrent une météo souvent clémente et des lumières magnifiques. L'été est prisé mais plus chaud.</p>"
          q2:
            question: Faut-il adapter sa robe au lieu ?
            answer_html: "<p>Oui : longueur, traîne et matière doivent tenir compte du sol et du vent, surtout en extérieur.</p>"
          q3:
            question: La boutique est-elle accessible depuis Nice ou Monaco ?
            answer_html: "<p>Oui, Cannes est à environ 30 minutes de Nice et 45 minutes de Monaco en voiture.</p>"
      festival_de_cannes_histoire_tenues:
        link_title: Tenues Festival de Cannes
        header_title: Le Festival de Cannes et ses tenues mythiques
        header_subtitle: Histoire du tapis rouge cannois
        intro_html: "<p>Depuis 1946, le Festival de Cannes transforme la ville en vitrine mondiale de l'élégance. Robes longues, smokings, créations audacieuses : le tapis rouge raconte l'histoire de la mode autant que celle du cinéma.</p><p>Nous avons vu évoluer ces codes vestimentaires. Ce guide retrace cette histoire — et le lien entre Festival et boutique.</p>"
        sections:
          tapis:
            title: Naissance du tapis rouge
            body_html: "<p>Le tapis rouge s'impose progressivement comme rituel de représentation. Il organise l'arrivée des artistes, crée une distance symbolique avec le public et donne aux photographes un cadre parfaitement identifiable.</p><p>À Cannes, ce rituel est devenu indissociable de l'image du Festival : les tenues sont commentées autant que les films, parce qu'elles racontent aussi une époque, une maison de couture, une personnalité et parfois une prise de risque.</p>"
          evolution:
            title: Évolution des silhouettes
            body_html: "<p>Des années 50 aux créations contemporaines, les robes de gala gagnent en audace : volumes sculpturaux, dos nus, fentes, broderies, transparences maîtrisées. Les silhouettes changent, mais la robe longue reste un repère fort des grands événements.</p><p>Côté masculin, le smoking classique demeure une référence, tout en cohabitant aujourd'hui avec des interprétations plus modernes : vestes colorées, coupes plus ajustées, détails de col ou accessoires moins attendus.</p>"
          boutique:
            title: Autour D'Un Soir et le Festival
            body_html: <p>Pendant le Festival, la boutique accueille clients et professionnels pour des tenues de soirée et smokings. Voir notre page <a href="/fr/festival-de-cannes">Festival de Cannes</a> et le guide <a href="/fr/guides/tenue-gala-ceremonie">tenue de gala</a>.</p>
        faq:
          q1:
            question: Peut-on venir sans rendez-vous pendant le Festival ?
            answer_html: "<p>Oui, pendant le Festival de Cannes, la boutique accueille sans rendez-vous selon les disponibilités.</p>"
          q2:
            question: Proposez-vous location et vente ?
            answer_html: "<p>Oui, robes de soirée, smokings et accessoires en location ou à l'achat.</p>"
          q3:
            question: Où se trouve la boutique ?
            answer_html: "<p>29 boulevard Carnot, 06400 Cannes, à quelques minutes du Palais des Festivals.</p>"
