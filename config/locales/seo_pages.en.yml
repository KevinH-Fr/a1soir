      robe_de_mariee_cannes:
        link_title: Wedding dress Cannes
        header_title: Wedding dress in Cannes
        header_subtitle: Wedding shop in Cannes — collections, fittings and alterations since 1980
        intro_html: '<p>Since 1980, <strong>Autour D''Un Soir</strong> has been a wedding shop in Cannes guiding brides-to-be across the French Riviera. Unlike an online shop, we welcome you in a private fitting room: you feel the fabrics, try the cuts and benefit from alterations by our in-house workshop through to your wedding day.</p><p>Short or long dresses, bohemian, ball gown or mermaid styles: our advisors and seamstresses help you find the dress that matches your shape, budget and wedding vibe. Read our <a href="/en/guides/comment-choisir-sa-robe-de-mariee">guide to choosing your wedding dress</a> before your appointment.</p>'
        cta_title: Book your fitting in Cannes
        sections:
          histoire:
            title: Forty years of wedding dresses in Cannes
            body_html: "<p>When the shop opened in 1980, brides often chose classic long gowns with lace and pronounced trains. Over the decades we have seen ball gowns, mermaid silhouettes, then the rise of bohemian styles and outdoor weddings on the French Riviera.</p><p>That experience helps us guide you wisely: we know what photographs well in Mediterranean light, what suits a Provence estate ceremony or an evening reception in Cannes. Every collection is chosen for elegance, comfort and careful finishing.</p>"
          boutique:
            title: A leading address in Cannes
            body_html: '<p>Our shop at 29 boulevard Carnot welcomes brides by appointment. You are not left alone in front of a rail of dresses: an advisor prepares a selection based on your wishes, body shape and wedding date.</p><p>Fittings take place in a spacious room; you may bring family or friends. Our seamstresses then handle alterations (length, bodice, straps) for a flawless fit. Learn more on our <a href="/en/la_boutique">shop and team page</a>.</p>'
          collections:
            title: Collections for every style
            body_html: "<p>We offer short and long wedding dresses in crepe, satin, tulle or lace. Silhouettes range from clean sheaths to full ball gowns, mermaid cuts and flowing bohemian styles with sleeves.</p><p>All our wedding dresses are <strong>sold in store</strong>: you leave with a garment tailored to you, not a one-size rental. Browse a selection online, then refine your choice at your fitting.</p>"
          services:
            title: Fitting, alterations and guidance
            body_html: '<p>Booking an appointment is strongly recommended so an advisor and fitting room are ready for you. Ideally, start looking <strong>8 to 12 months</strong> before the wedding for the widest choice and workshop timelines.</p><p>Alterations are part of our service: measurements in store, progressive adjustments and a final check before the big day. To prepare your visit, see our <a href="/en/essayage-robe-de-mariee-cannes">wedding dress fitting in Cannes</a> page.</p>'
          acces:
            title: Getting to the shop from the region
            body_html: "<p>The shop is a short walk from Cannes train station. By car from Nice: about 30 minutes (A8 exit 42 or coastal road). From Antibes: 20 minutes; from Monaco: 45 minutes. Public car parks nearby (Mozart, Saint-Nicolas, Vauban).</p><p>By train, the Nice–Cannes TER stops 5 minutes on foot from the shop. Book your fitting slot in advance, especially during peak wedding season on the Riviera.</p>"
        faq:
          q1:
            question: Where can I try on a wedding dress in Cannes?
            answer_html: "<p>At Autour D'Un Soir, 29 boulevard Carnot in Cannes. Book online or call +33 4 93 45 17 17.</p>"
          q2:
            question: Do you offer wedding dress rental?
            answer_html: "<p>No. Our wedding dresses are for purchase only, so we can carry out final alterations and a fit tailored to your silhouette.</p>"
          q3:
            question: How far in advance should I order my dress?
            answer_html: "<p>We recommend starting 8 to 12 months before the date. That allows time for fittings, supplier orders if needed and workshop alterations.</p>"
          q4:
            question: How many fittings should I plan?
            answer_html: "<p>Usually two to three appointments are enough: a first visit to explore styles, a second to refine the dress and accessories, then a final fitting after alterations.</p>"
          q5:
            question: Should I budget for alterations and accessories?
            answer_html: "<p>Yes. Beyond the dress, allow for veil, shoes, jewellery and any specific alterations. In store we help you balance your full look with your overall budget.</p>"
      essayage_robe_de_mariee_cannes:
        link_title: Wedding dress fitting Cannes
        header_title: Wedding dress fitting in Cannes
        header_subtitle: A special moment in our fitting room
        intro_html: '<p>Your fitting is when the dress becomes real: you feel the fabrics, see how it moves and share the moment with loved ones. At Autour D''Un Soir in Cannes, every appointment is prepared in advance by an advisor who knows our collection.</p><p>Whether you live in Cannes or the wider region, we welcome you in a spacious fitting room. Read our <a href="/en/guides/comment-choisir-sa-robe-de-mariee">how to choose your dress</a> guide first to arrive with clear ideas.</p>'
        cta_title: Book my fitting
        sections:
          deroulement:
            title: How does a fitting work?
            body_html: "<p>After booking, we prepare a selection based on your wedding date, budget and visual references. In the fitting room you try several silhouettes: ball gown, mermaid, bohemian, sheath.</p><p>Your advisor takes notes, photographs favourites (with your consent) and plans alterations if you confirm a purchase. Allow about 1.5 to 2 hours for a relaxed first visit.</p>"
          conseils:
            title: Our tips before your fitting
            body_html: "<p>Bring nude underwear, heels close to your wedding height, and 5 to 10 inspiration photos — not an endless list. Limit yourself to 1 or 2 guests whose taste you trust.</p><p>Avoid heavy makeup on the neckline and fresh tan lines that can skew how pale lace looks. Arrive 10 minutes early to settle in calmly.</p>"
          retouches:
            title: 'After your choice: alterations and timeline'
            body_html: '<p>Once you choose a dress, our workshop schedules alterations: hems, tapers, straps, train. A second appointment confirms the fit after work is done.</p><p>Wedding dresses are sold in store — not rented — for a final tailored fit. See our <a href="/en/robe-de-mariee-cannes">wedding dress Cannes</a> page for collections.</p>'
          acces:
            title: Getting to the shop
            body_html: "<p>29 boulevard Carnot, 5 minutes from Cannes train station. Parking nearby. About 30 min from Nice, 20 min from Antibes, 45 min from Monaco.</p><p>Book online or by phone, especially March to September, peak wedding season on the Riviera.</p>"
        faq:
          q1:
            question: Is an appointment required?
            answer_html: "<p>Strongly recommended: a dedicated advisor and prepared fitting room await you. Without an appointment, welcome depends on how busy we are.</p>"
          q2:
            question: Do you welcome clients from across the region?
            answer_html: "<p>Yes — Nice, Antibes, Monaco and the Alpes-Maritimes. Private fitting and alterations on site in Cannes.</p>"
          q3:
            question: How many dresses can I try?
            answer_html: "<p>For a first appointment we usually plan 6 to 8 targeted models, with more at a second visit if needed.</p>"
          q4:
            question: Can I bring my mother or bridesmaids?
            answer_html: "<p>Yes, 1 or 2 guests are welcome. Beyond that, opinions can get confusing — choose people whose judgment you value.</p>"
      costume_mariage_cannes:
        link_title: Wedding suit Cannes
        header_title: Wedding suit & tuxedo in Cannes
        header_subtitle: Ceremony wear for men and children
        intro_html: '<p>Groom, best man or honoured guest: men''s formal wear sets the tone for the wedding party. In Cannes, Autour D''Un Soir offers tuxedos, three-piece suits and children''s outfits, for <strong>rental or purchase</strong>, with fitting and workshop alterations.</p><p>Our team guides you according to dress code — daytime, evening, beach or gala. Compare <a href="/en/guides/smoking-ou-costume-mariage">tuxedo or suit</a> and our <a href="/en/guides/location-smoking-costume-cannes">rental packages in Cannes</a>.</p>'
        cta_title: Discover our suits in store
        sections:
          collections:
            title: Tuxedos and suits
            body_html: "<p>Black or midnight blue tuxedo, navy, beige or charcoal suit: slim or classic cuts, always adjustable in store. Shirts, bow ties, neckties and pocket squares coordinated on site.</p><p>4-day rental suits a one-off wedding; buying makes sense if you wear ceremony wear regularly. We compare both options honestly.</p>"
          essayage:
            title: Fitting and alterations
            body_html: "<p>Bring your ceremony shoes to the fitting: trouser length and posture are judged standing. Our workshop handles hems, tapers and sleeves.</p><p>Booking is recommended, especially April to June (weddings and Cannes Festival). Reserve early for size and colour.</p>"
          enfants:
            title: Outfits for the little ones
            body_html: "<p>Page boys and young attendants: fitted suits, colours harmonised with the groom. Rental or purchase depending on the model.</p><p>A family group fitting simplifies colours and official photos.</p>"
          acces:
            title: Shop in Cannes
            body_html: "<p>29 boulevard Carnot, near the train station. About 30 min from Nice, 20 min from Antibes, 45 min from Monaco. Public parking nearby.</p>"
        faq:
          q1:
            question: Can I try on a suit if I'm coming from Nice or Antibes?
            answer_html: "<p>Yes, by appointment. The shop is in Cannes, reachable by train or car.</p>"
          q2:
            question: Rental or purchase for a wedding?
            answer_html: "<p>Rental for a one-off event; purchase if you will wear the outfit again. Our advisors guide you based on your situation.</p>"
          q3:
            question: Do you offer tuxedos for Cannes Festival?
            answer_html: "<p>Yes, with fitting and early booking recommended in May.</p>"
      comment_choisir_sa_robe_de_mariee:
        link_title: How to choose your wedding dress
        header_title: How to choose your wedding dress?
        header_subtitle: 'Style, budget, timeline: expert advice'
        intro_html: '<p>Choosing your wedding dress can feel overwhelming: inspiration moves fast, advice contradicts itself, and the fear of getting it wrong is real. Yet a wedding dress is first of all a constructed garment: a cut, a fabric, a drape, a way of moving.</p><p>This guide does not replace the fitting room — that is where the dress comes alive on you — but it helps you understand the useful criteria: style, budget, timing, comfort and consistency with the venue. You can then book on our <a href="/en/robe-de-mariee-cannes">wedding dresses in Cannes</a> page.</p>'
        sections:
          style:
            title: Define your style
            body_html: "<p>Start with your wedding, not with a trend: venue (church, beach, estate), season, formality. A rustic Provence wedding often points to flowing fabrics; an evening reception in Cannes may call for a more structured line, easier to read under artificial light.</p><p>Look at the main families: <strong>bohemian</strong> (lace, sleeves, movement), <strong>ball gown</strong> (full skirt), <strong>mermaid</strong> (fitted silhouette), <strong>minimalist</strong> (clean lines). Behind those names are technical choices: skirt volume, bodice support, fabric weight, crepe softness or lace relief. Bring 5 to 10 reference photos to your fitting, not a list of 50 contradictory looks.</p>"
          budget:
            title: Plan your budget
            body_html: "<p>The dress is only part of the outfit budget: allow for veil or cape, shoes, jewellery, a possible second dress, and alterations. In store we explain clearly what is included in the listed price.</p><p>Set an overall budget before your fitting and share it with your advisor — that avoids falling for a dress out of reach. We can suggest alternatives in the same style family at different price points.</p>"
          delais:
            title: Allow enough time
            body_html: "<p>Ideally, start 8 to 12 months before the wedding. Some dresses are available immediately; others need a supplier order (12 to 16 weeks). Workshop alterations also require several visits.</p><p>During busy periods on the French Riviera (spring–summer), fitting slots fill quickly: book early even if not every detail of your décor is fixed yet.</p>"
          essayage:
            title: Prepare for your fitting
            body_html: '<p>Wear nude underwear, heels close to your wedding height and minimal makeup on necklines. Come with 1 or 2 trusted guests — too many opinions can cloud your own feeling.</p><p>In the fitting room, go step by step: silhouette first, fabric second, details last. A dress should be judged standing, seated and in motion: a fabric may fall beautifully in front of a mirror but pull at the bodice, weigh on the shoulders or restrict walking. See our <a href="/en/essayage-robe-de-mariee-cannes">fitting in Cannes</a> page for more.</p>'
          morphologie:
            title: Body shape and cut
            body_html: '<p>Body-shape guides (mermaid, ball gown, sheath) are useful pointers, but only a fitting decides: the same cut can surprise you positively. See our <a href="/en/guides/robe-de-mariee-morphologie">dress and body shape guide</a>.</p><p>Our team looks at posture, torso length and proportions to suggest dresses that flatter you — without boxing you into a single category.</p>'
          erreurs:
            title: Common mistakes to avoid
            body_html: "<p>Buying too early before your wedding style is clear, or waiting until the last minute. Copying an influencer's dress without considering your shape. Bringing too large a committee that imposes its taste.</p><p>Forgetting comfort: you will wear the dress for hours and may dance. Leaving accessories until the last moment when they change the whole silhouette. Confusing evening rental with wedding dress purchase: our wedding dresses are <strong>sold</strong> for final alterations.</p>"
          histoire:
            title: How tastes have evolved in our shop
            body_html: "<p>Tastes move in cycles. The 1980s left room for marked sleeves and visible volume; the 1990s and 2000s saw cleaner lines return; the 2010s popularised bohemian dresses, detailed backs and highly personal weddings.</p><p>These changes show that a wedding dress is never separate from its era. To avoid a costume effect or an overly dated trend, look at what remains readable over time: good proportion, quality fabric, a detail placed in the right spot. That is often what ages best in photographs.</p>"
        faq:
          q1:
            question: When should I start looking for my wedding dress?
            answer_html: "<p>8 to 12 months before the date is ideal. You get the best choice and workshop time without stress.</p>"
          q2:
            question: Should I budget for accessories?
            answer_html: "<p>Yes: veil, shoes, jewellery and any extra alterations add to the dress price. In store we help you plan the full look.</p>"
          q3:
            question: Can I bring someone to my fitting?
            answer_html: "<p>Yes — 1 or 2 guests are enough. Too many people can make the decision harder.</p>"
          q4:
            question: Do I need a second dress for the evening?
            answer_html: "<p>It is a plus for dancing freely, especially with a long dress or train. It is optional depending on how your reception is organised.</p>"
          q5:
            question: Can I rent a wedding dress at Autour D'Un Soir?
            answer_html: "<p>No. Wedding dresses are sold in store for final alterations and fit. We do offer rental for many evening outfits.</p>"
      robe_de_mariee_boheme:
        link_title: Bohemian wedding dress
        header_title: Bohemian wedding dress
        header_subtitle: Flowing, romantic and natural
        intro_html: '<p>The bohemian wedding dress combines freedom, romance and comfort: flowing fabrics, delicate lace, open back or light sleeves. Its aesthetic belongs to a wider history, between folk inspiration, a taste for natural-looking materials and ceremonies less formal than very classic weddings.</p><p>Very popular on the French Riviera for outdoor weddings, it suits ceremonies by the sea or in Provence estates. This guide helps you refine your criteria before your appointment; for the bigger picture, see <a href="/en/guides/comment-choisir-sa-robe-de-mariee">how to choose your wedding dress</a>.</p>'
        sections:
          matieres:
            title: Fabrics and details
            body_html: "<p>Bohemian style is about movement: light crepe, soft tulle, guipure lace, floral embroidery or sheer sleeves. Guipure, thicker and more drawn than some fine laces, gives visible relief in photos; crepe creates a more fluid, matte line.</p><p>Details include low or V-back, thin belts, short trains or detachable trains for the evening. Finishes may feel freer (fringe, floral motifs, scalloped edges), but they require as much precision as a very structured dress.</p>"
          coupe:
            title: Cuts and silhouettes
            body_html: "<p>Bohemian is not one single cut: it can be a flowing empire line, a soft mermaid, or a fitted bodice with a flared skirt. Long lace sleeves are iconic, but fine straps or a bustier work too.</p><p>Think comfort: walking on sand, sea breeze, summer heat. In the fitting room we test the dress in motion, not only in the mirror.</p>"
          saison_lieu:
            title: Season and venue
            body_html: "<p>In summer on the Riviera, choose breathable fabrics and a dress that does not drag too much on sand or grass. For a Provence estate, ivory, champagne and ivory lace blend beautifully with the setting.</p><p>Indoor bohemian weddings are possible too: adjust train length and transparency. Discuss this with your advisor at your Cannes fitting.</p>"
          accessoires:
            title: Bohemian accessories
            body_html: '<p>Flower crown, light veil, flat sandals or wedge heels, subtle gold jewellery: accessories complete the dress without overpowering it. Avoid very « princess » tiaras if your line is natural.</p><p>In store we coordinate veil, jewellery and shoes with your dress. See our <a href="/en/guides/chaussures-accessoires-soiree">shoes and accessories guide</a>.</p>'
          histoire:
            title: Bohemian style in our shop
            body_html: "<p>Bohemian bridal wear spread especially in the 2010s, with outdoor ceremonies, more personal weddings and visual references shared online. It also reuses older codes: lace, soft sleeves, flower crowns and less corseted silhouettes.</p><p>On the French Riviera, this style has to remain practical: wind, heat, strong light, outdoor photos. A successful bohemian dress is not only beautiful on a hanger; it keeps its drape when you walk, sit and stay in it as the ceremony unfolds.</p>"
        faq:
          q1:
            question: Is a bohemian dress suitable for a beach wedding?
            answer_html: "<p>Yes, with a suitable length (short or detachable train) and light fabrics. Your fitting confirms comfort when moving.</p>"
          q2:
            question: Lace or crepe for a bohemian look?
            answer_html: "<p>Both work: lace for romance, crepe for a modern flowing drape. Many dresses combine the two.</p>"
          q3:
            question: Which bohemian dress for my body shape?
            answer_html: <p>Bohemian styles suit several shapes thanks to flowing cuts and belts. See our <a href="/en/guides/robe-de-mariee-morphologie">body shape guide</a>, then confirm in store.</p>
          q4:
            question: Where can I try on a bohemian wedding dress in Cannes?
            answer_html: <p>At Autour D'Un Soir, 29 boulevard Carnot. Book a fitting on our <a href="/en/robe-de-mariee-cannes">wedding dress Cannes</a> page.</p>
      robe_de_mariee_morphologie:
        link_title: Wedding dress body shape
        header_title: Which dress for your body shape?
        header_subtitle: Mermaid, ball gown, sheath, bustier
        intro_html: '<p>Body-shape guides give pointers, but nothing replaces a fitting: a mermaid dress can surprise someone who thought they were « ball gown only ». A cut works through very concrete elements: waist placement, bodice support, skirt volume and vertical lines.</p><p>This guide helps you narrow your search before your appointment without boxing yourself into a category. Then refine at your <a href="/en/essayage-robe-de-mariee-cannes">fitting in Cannes</a> and on our <a href="/en/robe-de-mariee-cannes">wedding dresses</a> page.</p>'
        sections:
          sirene:
            title: Mermaid dress
            body_html: "<p>The mermaid fits bust and hips, then usually flares around the knee or slightly above depending on the model. It creates a very defined line, appreciated for its sculptural effect.</p><p>Technically, everything depends on the balance between support and ease: if the flare starts too low, walking becomes difficult; if the fabric is too soft, the line loses its intention. Check stairs, dancing and sitting before deciding.</p>"
          princesse:
            title: Ball gown
            body_html: "<p>The ball gown relies on a clear contrast: fitted bodice, full skirt from the natural waist or sometimes slightly lower. Volume can come from tulle, organza, petticoats or several fabric layers.</p><p>It looks majestic in photos, but the volume should stay proportionate to the venue and your stature. In a small room, a very wide skirt may be less practical; in an estate or large hall, it has room to exist.</p>"
          fourreau:
            title: Sheath dress
            body_html: "<p>Straight or slightly flared line, close without being bodycon. Chic, modern, often minimalist.</p><p>Suits those who love a clean silhouette. Flowing crepe is often more comfortable than stiff satin.</p>"
          bustier:
            title: Bustier and shoulders
            body_html: "<p>Bustiers structure the upper body; wide straps or sleeves add support. If you have narrow shoulders, a structured neckline or sleeves can balance the silhouette.</p><p>At your fitting, raise your arms and test hugs: support should stay comfortable all day.</p>"
          essayage:
            title: Why the fitting decides
            body_html: '<p>Body shape is not a single letter: torso length, posture and personal taste matter as much. Our Cannes advisors cross your feelings with experience to suggest 6 to 8 relevant dresses.</p><p>See also <a href="/en/guides/comment-choisir-sa-robe-de-mariee">how to choose your dress</a> for style and budget.</p>'
        faq:
          q1:
            question: Can one body shape wear several cuts?
            answer_html: "<p>Yes. Guides are pointers, not rules. Only a fitting confirms what flatters you.</p>"
          q2:
            question: Does a ball gown make you look bigger?
            answer_html: "<p>Volume starts at the waist: chosen well, it structures without adding bulk. Waist height and neckline make the difference.</p>"
          q3:
            question: Where can I try dresses for my shape in Cannes?
            answer_html: "<p>Autour D'Un Soir, 29 boulevard Carnot. Book a fitting for a targeted selection.</p>"
      smoking_ou_costume_mariage:
        link_title: Tuxedo or wedding suit
        header_title: Tuxedo or wedding suit?
        header_subtitle: The right choice for the occasion
        intro_html: <p>Choosing between tuxedo and suit comes from two different traditions. The tuxedo belongs to evening wear and black tie codes; the suit remains more flexible, suited to daytime ceremonies, civil weddings and less formal events.</p><p>Dress code, time and venue — church, beach, estate, evening — therefore guide the decision. At our Cannes shop we offer both, for rental or purchase, with fitting. For rental packages see <a href="/en/guides/location-smoking-costume-cannes">tuxedo rental Cannes</a> and <a href="/en/costume-mariage-cannes">wedding suits</a>.</p>
        sections:
          smoking:
            title: When to choose a tuxedo?
            body_html: "<p>Evening wedding, black tie reception, gala or very formal ceremony: the tuxedo is the reference. It differs from a suit through satin or grosgrain details on the lapel, the trouser line and the traditional pairing with a white shirt and bow tie.</p><p>Black remains the great classic. Midnight blue is also used in evening wear because it can keep more depth under some artificial lights. Try both in the fitting room according to the real context of the event.</p>"
          costume:
            title: When to choose a suit?
            body_html: "<p>Civil wedding, daytime ceremony, garden or smart chic: a three-piece suit in blue, beige, grey or bottle green offers more freedom. A tie lengthens the silhouette; a bow tie gives a more ceremonial note.</p><p>The suit is also practical: it is easier to wear again for professional or family events. Fit remains essential: clean shoulders, correct sleeve length and trousers breaking properly over the shoe.</p>"
          accessoires:
            title: Accessories and consistency
            body_html: "<p>Pocket square, belt, cufflinks, discreet watch: details unify the look. Match the wedding party and bride if you are best man.</p><p>Everything is coordinated in store — no need to buy elsewhere without trying on.</p>"
          location:
            title: Rent or buy?
            body_html: "<p>For a one-off wedding, 4-day rental is cost-effective; our workshop adjusts the outfit for a perfect fit. For several events a year, buying may pay off.</p><p>Our advisors compare both without pushing the more expensive option.</p>"
        faq:
          q1:
            question: Should a best man match the groom's style?
            answer_html: "<p>Not necessarily identical, but harmonised: same formality level (tuxedo vs suit) and complementary colours.</p>"
          q2:
            question: Is a tuxedo mandatory for an evening wedding?
            answer_html: "<p>If dress code is black tie, yes. Otherwise a very dressy dark suit may suffice — check with the couple.</p>"
          q3:
            question: Where to try tuxedo and suit in Cannes?
            answer_html: "<p>Autour D'Un Soir, 29 boulevard Carnot, by appointment.</p>"
      robe_invitee_mariage:
        link_title: Wedding guest dress
        header_title: Wedding guest outfit
        header_subtitle: Elegant without stealing the spotlight
        intro_html: '<p>As a wedding guest you want balance between elegance and discretion: avoid white and shades too close to the bride while expressing your style. Cocktail, long dress or chic set: the invitation dress code is your first reference.</p><p>In Cannes, Autour D''Un Soir offers short and long dresses for <strong>rental or purchase</strong>, with fitting. See also <a href="/en/guides/achat-ou-location-tenue-soiree">buy or rent</a> and <a href="/en/guides/chaussures-accessoires-soiree">accessories</a>.</p>'
        sections:
          dresscode:
            title: Read the dress code
            body_html: "<p><strong>Rustic</strong>: flowing, floral, midi length. <strong>Chic</strong>: cocktail or simple long. <strong>Black tie</strong>: long dress for very formal evenings.</p><p>When in doubt, an elegant midi in a deep colour (blue, green, burgundy) is safe. Ask the couple if a colour theme applies.</p>"
          couleurs:
            title: Colours and pitfalls
            body_html: "<p>White, ivory and ecru are for the bride. Very pale pastels can also blur in photos. Prefer rich colours or discreet floral prints.</p><p>For an evening wedding on the Riviera, light fabrics with a shawl or bolero for cooler air work well.</p>"
          location:
            title: Rent or buy?
            body_html: "<p>4-day rental suits an outfit worn once or twice. Buying makes sense for several weddings or galas in a year.</p><p>In-store fitting: confirm length, comfort seated and harmony with your shoes.</p>"
          accessoires:
            title: Shoes and finishing touches
            body_html: <p>Stable heels for dancing, matching clutch, understated jewellery. Test the full look in the fitting room.</p><p>Our <a href="/en/guides/chaussures-accessoires-soiree">shoes and accessories guide</a> covers coordination.</p>
        faq:
          q1:
            question: Can I wear black as a guest?
            answer_html: "<p>Yes, unless the couple says otherwise. Black is elegant for an evening wedding.</p>"
          q2:
            question: Long or cocktail dress?
            answer_html: "<p>Depends on dress code and time: cocktail for afternoon, long often for evening or black tie.</p>"
          q3:
            question: Where to rent a guest dress in Cannes?
            answer_html: "<p>Autour D'Un Soir, 29 boulevard Carnot, by appointment with fitting.</p>"
      tenue_gala_ceremonie:
        link_title: Gala & ceremony outfit
        header_title: Gala and ceremony outfit
        header_subtitle: Galas, christenings, graduations and formal evenings
        intro_html: '<p>Galas, christenings, graduations or evenings during Cannes Festival: each occasion has its formality level. A successful outfit respects the code without being showy, because elegance depends on context as much as on the piece itself.</p><p>Evening dress codes come from a long social tradition: long dress for the most formal events, tuxedo for black tie, cocktail wear for less protocol-heavy moments. Compare <a href="/en/guides/robe-invitee-mariage">wedding guest wear</a> and <a href="/en/guides/location-smoking-costume-cannes">tuxedo rental</a> for men.</p>'
        sections:
          femmes:
            title: For women
            body_html: "<p><strong>Gala / black tie</strong>: long dress, fine fabrics (silk, satin, crepe), discreet jewellery. <strong>Smart cocktail</strong>: sophisticated midi or short. <strong>Chic christening</strong>: pastels or elegant prints; avoid pure white if the family reserves it.</p><p>Satin reflects more light, crepe gives a more matte finish, tulle adds volume. In the fitting room, check seated comfort, length with your shoes and how the fabric behaves under strong light.</p>"
          hommes:
            title: For men
            body_html: "<p>Tuxedo for black tie; three-piece suit for smart cocktail or less strict gala. Patent shoes or oxfords, coordinated pocket square and bow tie.</p><p>During Cannes Festival, book early: high demand in May.</p>"
          occasions:
            title: Which occasions?
            body_html: "<p>Christenings, communions, charity galas, corporate events, award ceremonies, Croisette dinners: we cover most dress codes in the region.</p><p>4-day rental or purchase depending on how often you dress up — our advisors guide you.</p>"
          festival:
            title: Cannes Festival and prestige events
            body_html: "<p>Red carpets and private parties need a very readable outfit: clean line, controlled length, coherent accessories. Flash photography emphasises reflections, creases and transparency; a fabric that looks beautiful in soft light may behave differently in photos.</p><p>The Festival concentrates demand in May: anticipate fittings, especially for tuxedos, long gowns and last-minute alterations.</p>"
        faq:
          q1:
            question: What's the difference between gala and cocktail dress code?
            answer_html: "<p>Gala or black tie calls for a long dress or tuxedo. Cocktail allows a bolder midi or short dress, or a suit with tie for men.</p>"
          q2:
            question: Can I rent an outfit for a gala in Cannes?
            answer_html: "<p>Yes, dresses and tuxedos are available to rent in store, with fitting and workshop adjustments for a perfectly tailored look. Ideal for a one-off event on the Riviera.</p>"
      achat_ou_location_tenue_soiree:
        link_title: Buy or rent evening wear
        header_title: Buy or rent evening wear?
        header_subtitle: The guide to making the right choice
        intro_html: "<p>Wedding guest, gala, corporate evening or Cannes Festival: should you rent or buy? It depends on frequency, budget and whether you want a signature piece to keep.</p><p>At Autour D'Un Soir, evening dresses, tuxedos and suits are available for <strong>4-day rental</strong> or purchase — wedding dresses are purchase only. Fitting in store in Cannes.</p>"
        sections:
          location:
            title: Benefits of renting
            body_html: "<p>Access premium outfits on a controlled budget. Cleaning and pressing included in our service. Ideal for a one-off event or a size you will not wear again.</p><p>Standard package: pick up 2 days before, return 2 days after. Deposit at pick-up, 30% booking deposit.</p>"
          achat:
            title: Benefits of buying
            body_html: "<p>Worth it if you attend several weddings or galas a year, or want a piece you can alter repeatedly.</p><p>Buying also lets you choose a cut perfectly adjusted to your shape, with no return deadline.</p>"
          comparatif:
            title: Quick decision guide
            body_html: "<p><strong>Rent</strong> if: one event, tight budget, want variety. <strong>Buy</strong> if: recurring events, reference outfit, important bespoke alterations.</p><p>If unsure, our advisors compare total cost (repeat rental vs purchase) at your fitting.</p>"
          boutique:
            title: Fitting in Cannes
            body_html: <p>Rental and purchase are in store only — to confirm size, comfort and style. 29 boulevard Carnot.</p><p>See <a href="/en/guides/location-smoking-costume-cannes">tuxedo rental</a> for men and <a href="/en/guides/robe-invitee-mariage">guest dress</a> for women.</p>
        faq:
          q1:
            question: Can I rent online?
            answer_html: "<p>No. Rental and fitting in our Cannes shop only, to adjust the outfit to your shape.</p>"
          q2:
            question: How long is the rental period?
            answer_html: "<p>Standard 4 days: pick up 2 days before the event, return 2 days after.</p>"
          q3:
            question: Can I rent a wedding dress?
            answer_html: "<p>No. Wedding dresses are sold in store. Rental covers evening wear, tuxedos and suits.</p>"
      location_smoking_costume_cannes:
        link_title: Tuxedo & suit rental
        header_title: Tuxedo and suit rental in Cannes
        header_subtitle: Fitting, alterations and rental packages in store
        intro_html: '<p>For a wedding, gala or Cannes Festival event, renting a tuxedo or suit lets you adapt the outfit precisely to one occasion: formality level, time of day, venue, season and photos. The issue is not only size, but the consistency of the full look.</p><p>Our standard package covers 4 days (pick up before the event, return after). To understand the dress-code differences, compare with our <a href="/en/guides/achat-ou-location-tenue-soiree">buy or rent guide</a> and <a href="/en/guides/smoking-ou-costume-mariage">tuxedo or suit</a> comparison.</p>'
        sections:
          formules:
            title: Our rental packages
            body_html: '<p>Standard rental is <strong>4 days</strong>: pick up 2 days before your event, return 2 days after (as on our <a href="/en/faq">FAQ</a>). Fitting takes place before pick-up; our workshop adjusts the outfit so it fits you perfectly on the day.</p><p>Black or midnight blue tuxedos, three-piece ceremony suits, trousers and jackets, plus bow ties, belts and pocket squares are available in store. A deposit proportional to the outfit value is required at pick-up.</p>'
          essayage:
            title: Fitting and workshop adjustments
            body_html: "<p>Every rental starts with a fitting: we check shoulder fit, jacket and trouser length, and how the shirt sits. Our workshop then carries out the necessary alterations (hems, tapers, sleeves) so the outfit fits you perfectly.</p><p>Bring your ceremony shoes to the fitting for trouser length. Booking is recommended, especially during Cannes Festival or summer wedding season.</p>"
          occasions:
            title: Weddings, galas and events
            body_html: "<p><strong>Evening wedding</strong>: tuxedo or dark suit depending on dress code. <strong>Daytime wedding</strong>: blue, beige or grey suit. <strong>Gala or ceremony</strong>: black tie tuxedo or three-piece suit.</p><p>Vocabulary matters: black tie normally means tuxedo and bow tie; cocktail leaves more freedom; a civil ceremony often allows a lighter or less formal outfit. During Cannes Festival, book early for parties and red-carpet events.</p>"
          accessoires_homme:
            title: Accessories and finishing touches
            body_html: "<p>Bow tie or necktie, pocket square, belt, cufflinks: these details set the formality level. With a tuxedo, a cummerbund or low waistcoat, bow tie and black shoes remain the most classic references.</p><p>With a suit, the tie, pocket square and shoe colour can soften or dress up the look. The important thing is not to mix too many registers in the same outfit.</p>"
          enfants:
            title: Children's suits
            body_html: "<p>Page boys and young attendants: children's sizes with workshop adjustments. Rental or purchase depending on the model.</p><p>Booking a children's fitting with yours helps match colours and formality across the family.</p>"
          expertise:
            title: 'Rent or buy: our advice'
            body_html: "<p>Rental suits a one-off event (wedding guest, gala, Festival). Buying makes sense if you wear ceremony wear regularly. Our advisors compare both options honestly.</p><p>Since 1980 in Cannes we have dressed grooms, groomsmen and guests — that experience guides our advice on cut, colour and accessories.</p>"
          acces:
            title: Shop in Cannes
            body_html: '<p>29 boulevard Carnot, 5 minutes on foot from Cannes train station. By car: about 30 min from Nice, 20 min from Antibes, 45 min from Monaco. Public car parks nearby.</p><p>In-store booking with a 30% deposit to confirm rental. See also our <a href="/en/costume-mariage-cannes">wedding suits in Cannes</a> page.</p>'
        faq:
          q1:
            question: Can I rent a tuxedo without buying?
            answer_html: "<p>Yes. Tuxedos and suits are available for in-store rental, with fitting and workshop alterations for a perfect fit.</p>"
          q2:
            question: Do you also sell suits?
            answer_html: "<p>Yes, rental and purchase are both available. For repeated events, buying may be more cost-effective — our advisors will guide you.</p>"
          q3:
            question: Black tuxedo or midnight blue?
            answer_html: "<p>Black is the classic black tie choice. Midnight blue often photographs better in evening light and with flash. Try both in store for your event.</p>"
          q4:
            question: Do you rent children's suits?
            answer_html: "<p>Yes, with children's sizes and tailored adjustments. Book a fitting slot to coordinate with yours.</p>"
          q5:
            question: What if I return the outfit late?
            answer_html: "<p>Pick-up and return dates are set at booking. Late return may incur extra charges according to our in-store rental terms.</p>"
      chaussures_accessoires_soiree:
        link_title: Shoes & accessories
        header_title: Evening shoes and accessories
        header_subtitle: The finishing touches for wedding, gala or ceremony wear
        intro_html: '<p>A dress or suit is not enough: shoes, bags, jewellery and accessories set the final tone. A colour mismatch or wrong heel height can spoil otherwise great photos.</p><p>At our Cannes shop we coordinate every detail in the fitting room — wedding, gala or evening. After choosing your outfit, see <a href="/en/guides/comment-choisir-sa-robe-de-mariee">choosing your dress</a> or <a href="/en/guides/robe-invitee-mariage">guest wear</a> if needed.</p>'
        cta_title: Complete my outfit in store
        sections:
          chaussures:
            title: Choosing your shoes
            body_html: "<p>Heels, pumps, sandals or mules: height affects dress or trouser length. Try them <strong>with</strong> your outfit so we can adjust hems if needed; a few centimetres change the fall of a long dress.</p><p>Men: oxfords, loafers or patent depending on tuxedo or suit. Patent belongs to the most formal codes; smooth black leather is often more versatile. Also think about the ground: carpet, paving stones, sand or lawn do not require the same stability.</p>"
          accessoires:
            title: Bags, jewellery and finishing touches
            body_html: "<p>Clutch, belt, jewellery, shawl or bolero: each piece should serve the silhouette, not overload it. For weddings, avoid jewellery that competes with the bride.</p><p>Women's and men's selection in store for wedding, gala and evening.</p>"
          coordonner:
            title: Coordinating the whole look
            body_html: "<p>Coherent palette: jewellery metal (gold or silver), shoe shade, bag tone. Two dominant colours plus an accent are often enough. Accessories should create a reminder, not add a new idea to every detail.</p><p>Think about photography too: shiny materials catch flash, very pale pastels can look close to white, and too many mixed metals may read less clearly. The full outfit should remain legible up close and from a distance.</p>"
          boutique:
            title: Find our collections in Cannes
            body_html: "<p>29 boulevard Carnot. Try on in person to finalise before the big day. Ideal after choosing a dress with us or bringing yours for coordination.</p>"
        faq:
          q1:
            question: Can shoes and accessories be bought or rented?
            answer_html: "<p>Depending on the item, purchase or rental in store. Our team explains options for each model.</p>"
          q2:
            question: Should I bring my dress to choose shoes?
            answer_html: "<p>Strongly recommended for length and colours. Otherwise a photo or fabric swatch.</p>"
          q3:
            question: What heel height for a long dress?
            answer_html: "<p>The height you can wear all evening. At your fitting we adjust the hem accordingly.</p>"
      histoire_autour_dun_soir_cannes:
        link_title: Shop history
        header_title: The history of Autour D'Un Soir in Cannes
        header_subtitle: A fashion, workshop and events address
        intro_html: '<p>Since 1980, Autour D''Un Soir has built its craft around event wardrobes, costumes and the alteration workshop. In Cannes, the city lives to the rhythm of cinema, galas and Riviera weddings — a world where fittings, fabric choice and adjustments matter as much as style.</p><p>That philosophy is unchanged: guide every client with care, whether for a wedding, an evening, an audiovisual production or a historical re-enactment. See also our <a href="/en/robe-de-mariee-cannes">wedding dresses in Cannes</a> page.</p>'
        sections:
          origines:
            title: The beginnings in 1980
            body_html: "<p>The 1980s marked a visible turning point in event fashion: assertive silhouettes, stronger shoulders, a taste for shiny fabrics and sometimes very voluminous wedding dresses. At the same time, Cannes continued to connect cinema, private parties and prestige events.</p><p>In this world, clothing is not only functional: it is tied to a public, photographed, shared moment. That event culture explains the importance given to choice, fitting and adjustment.</p>"
          evolution:
            title: Four decades of craft
            body_html: "<p>Over the seasons we have seen ball gown volumes, the return of minimalism, the rise of bohemian styles and growing demand for film and TV wardrobe. These changes also follow evolving uses: more civil weddings, outdoor ceremonies, professional evenings and more mobile audiovisual productions.</p><p>The workshop became a pillar because a dress or suit is not just the size printed on a label. Hem, bodice, sleeve, jacket drape: those details turn a garment available in store into an outfit suited to a person and an occasion.</p>"
          cannes:
            title: Cannes and the French Riviera
            body_html: "<p>Our city is not just a backdrop: the Festival, seaside weddings, corporate galas and shoots shape our daily work. We know real constraints — summer heat, sea breeze, Provence estate stairs — and build them into our advice.</p>"
          aujourdhui:
            title: 'Today: one house, several crafts'
            body_html: '<p>Wedding dresses, evening rental, period costume, corporate services, audiovisual wardrobe: Autour D''Un Soir has become a versatile reference. What unites these activities is fabric, fit and listening. Read our guide on <a href="/en/guides/metier-couturiere-retouches">the seamstress craft</a> or visit <a href="/en/la_boutique">the shop</a>.</p>'
        faq:
          q1:
            question: Since when has Autour D'Un Soir existed?
            answer_html: "<p>The story of Autour D'Un Soir began in 1980. Today, the shop welcomes you at 29 boulevard Carnot in Cannes.</p>"
          q2:
            question: What services does the shop offer?
            answer_html: "<p>Wedding dresses (sales), evening wear (rental and sales), suits, period costume, workshop alterations and corporate/audiovisual services.</p>"
          q3:
            question: Is the shop only for brides?
            answer_html: "<p>No. We also support evening events, galas, film/TV productions and corporate events.</p>"
      metier_couturiere_retouches:
        link_title: Seamstress craft
        header_title: The seamstress craft in store
        header_subtitle: Behind the Autour D'Un Soir workshop
        intro_html: "<p>Behind every adjusted dress or altered suit are expert hands. At Autour D'Un Soir, the workshop is not a side service: it is the heart of the craft. Sophie, Sandra and the sewing team turn a standard garment into a piece that truly fits your shape.</p><p>This guide takes you behind the scenes: gestures, steps and why sewing makes all the difference, especially for a wedding dress.</p>"
        sections:
          atelier:
            title: Daily life in the workshop
            body_html: "<p>Hems, tapers, straps, trains, linings: every alteration starts with careful observation in the fitting room. The seamstress notes tension points, posture and real length in motion — not only in the mirror.</p><p>Technically, a successful alteration respects the garment's construction: fabric grain, lining, boning, closure, embroidery or lace motif. This step is discreet for the final client, but it determines comfort and elegance on the day.</p>"
          gestes:
            title: Gestures that matter
            body_html: "<p>Tapering a bodice without distorting lace, shortening a train while keeping the drape, adjusting a sleeve for dancing: these are precise skills built over years of practice.</p><p>Difficulty varies with the fabric. Satin shows tension easily, tulle requires patience across layers, and lace often means repositioning a motif by hand. This textile knowledge creates a clean result without the alteration being visible.</p>"
          mariage:
            title: Why it matters for weddings
            body_html: '<p>A wedding dress bought without alterations is rarely perfect: bodies are unique and ready-to-wear is built for standard sizes. That is why we sell wedding dresses in store with full workshop support. See <a href="/en/guides/savoir-faire-retouches-robe-mariee">wedding dress alterations expertise</a>.</p>'
        faq:
          q1:
            question: Who carries out alterations at Autour D'Un Soir?
            answer_html: "<p>Our in-house sewing team, with Sophie and Sandra among the house references.</p>"
          q2:
            question: Are alterations included?
            answer_html: "<p>For wedding dresses sold in store, alterations are part of the service. Minor adjustments are also included for evening rental.</p>"
          q3:
            question: How many workshop appointments should I plan?
            answer_html: "<p>Usually two to three for a wedding dress: measurements, intermediate fitting and final check.</p>"
      savoir_faire_retouches_robe_mariee:
        link_title: Wedding dress alterations
        header_title: Wedding dress alteration expertise
        header_subtitle: Why the workshop changes everything
        intro_html: "<p>Buying a wedding dress is not only choosing a model: it is an adjustment journey. Bodice, length, straps, train — every detail affects the final look and your comfort for hours.</p><p>At Autour D'Un Soir in Cannes we explain this work openly, so you understand why fitting and the workshop are inseparable from a successful dress.</p>"
        sections:
          buste:
            title: Bodice and support
            body_html: "<p>The bodice must support without squeezing. On a strapless or open-back dress, a few millimetres change the drape: too loose and the dress slips; too tight and it marks the skin and restricts breathing.</p><p>Structured dresses often use seams, boning, linings or internal support. Alterations must preserve that architecture, especially when the back is open or lace leaves less room for correction.</p>"
          longueur:
            title: Length and hem
            body_html: "<p>Hem length is decided with your wedding-day shoes, on a floor similar to the ceremony venue. A long dress should skim without making you trip; suit trousers should break correctly over the shoe.</p><p>Outdoors on the Riviera we also anticipate terrain: grass, sand, stone or stairs. A spectacular length in store may become less practical if the ceremony is outside or the evening involves a lot of movement.</p>"
          traine:
            title: Train and movement
            body_html: "<p>A dramatic train needs balance between aesthetics and practicality. We can add bustle systems for the evening or shorten slightly for dancing.</p>"
        faq:
          q1:
            question: Why not buy a dress without alterations?
            answer_html: "<p>Standard sizes rarely match a body 100%. Without alterations, a dress may slip, pull or mark in the wrong places.</p>"
          q2:
            question: When should alterations start?
            answer_html: "<p>After choosing the dress, ideally 2 to 3 months before the wedding to allow workshop appointments.</p>"
          q3:
            question: Where is the fitting in Cannes?
            answer_html: <p>At Autour D'Un Soir, 29 boulevard Carnot. See <a href="/en/essayage-robe-de-mariee-cannes">wedding dress fitting</a>.</p>
      costumes_epoque_histoire_mode:
        link_title: Period costumes
        header_title: 'Period costumes: a journey through history'
        header_subtitle: From the Renaissance to the 1980s
        intro_html: "<p>Every era has its silhouette, fabrics and codes. At Autour D'Un Soir our historical costume collection serves theatre, film, re-enactments and themed weddings — and anyone curious about how fashion tells history.</p><p>This guide is an invitation to travel through dress, sharing what forty years of costumes have taught us.</p>"
        sections:
          periodes:
            title: Major periods
            body_html: "<p>Renaissance, 18th century, Napoleonic era, Belle Époque, Roaring Twenties, mid-century, seventies and eighties: each period has its volumes, colours and accessories. Renaissance dress often plays with sleeves, brocades and constructed silhouettes; the 18th century emphasises panniers, embroidered coats and wigs; the 1920s shorten and fluidify lines.</p><p>A credible costume relies on these details, not only on a general « atmosphere ». Even for a non-academic event, choosing two or three accurate references helps avoid a fancy-dress effect.</p>"
          matieres:
            title: Fabrics and finishing
            body_html: "<p>Embroidery, lace, buttons, caps and hats complete the silhouette. Accessories are often what makes a period recognisable: a headpiece, cravat, braid, gloves or jewellery immediately guides the reading.</p><p>Consistency also depends on fabrics. A fabric that is too contemporary, too shiny or too stretchy can break the historical illusion, even if the general cut looks right.</p>"
          usages:
            title: Theatre, film and themed weddings
            body_html: <p>Our period costumes serve stage productions, shoots and private events. For a themed wedding see <a href="/en/guides/costume-epoque-mariage-theme">period wedding</a> or our <a href="/en/nos_autres_activites">other activities</a>.</p>
        faq:
          q1:
            question: Can period costumes be rented?
            answer_html: "<p>Yes, depending on pieces and dates. Contact the shop for a specific project.</p>"
          q2:
            question: Do you offer bespoke period costume?
            answer_html: "<p>Yes, our workshop creates bespoke pieces and replicas for specific projects.</p>"
          q3:
            question: Which periods are available?
            answer_html: "<p>From the Renaissance to the 1980s, with an evolving stock. The shop guides you according to your project.</p>"
      costume_epoque_mariage_theme:
        link_title: Period-themed wedding
        header_title: Planning a period-themed wedding
        header_subtitle: Historical consistency and elegance
        intro_html: "<p>A costume wedding can be magical — if you aim for consistency rather than fancy dress. The chosen era, venue, light and level of historical accuracy must work together.</p><p>Autour D'Un Soir regularly supports themed wedding projects on the French Riviera. Here is our advice to move forward with confidence.</p>"
        sections:
          choix:
            title: Choosing an era
            body_html: "<p>Belle Époque, 1920s, Renaissance: each choice implies different constraints for guests. Belle Époque suggests long dresses, bodices, hats and promenade elegance; the 1920s favour straighter lines, pearls, fringe and short hairstyles; Renaissance themes require more theatrical volume.</p><p>A clear direction with shared visual references works better than a vague theme. An « old-fashioned » theme without a precise period often creates a mix that is hard to harmonise in photos.</p>"
          coherence:
            title: Silhouette consistency
            body_html: "<p>Bride, groom, witnesses and guests: define a common level of expectation. You can aim for loose historical inspiration or a stricter re-enactment, but that needs deciding before fittings.</p><p>A very accurate period costume next to a modern outfit can create photo imbalance. Conversely, a coherent palette, a few well-chosen accessories and compatible silhouettes can sometimes create the atmosphere without constraining every guest.</p>"
          boutique:
            title: The shop's role
            body_html: <p>We advise on available pieces, required alterations and feasibility by date. Discover our collection on <a href="/en/guides/costumes-epoque-histoire-mode">period costumes</a>.</p>
        faq:
          q1:
            question: Can you mix a modern dress with a period theme?
            answer_html: "<p>Yes, with a clear aesthetic direction — for example a contemporary dress inspired by an era rather than strict re-enactment.</p>"
          q2:
            question: Should guests be warned early?
            answer_html: "<p>Yes, especially if they need to source or rent specific outfits.</p>"
          q3:
            question: Does the shop dress the groom too?
            answer_html: "<p>Yes, suits, tuxedos and period costume for men are available in store.</p>"
      costumes_cinema_television_cannes:
        link_title: Film & TV costumes
        header_title: Dressing film and television
        header_subtitle: The costume craft on the French Riviera
        intro_html: "<p>Cannes lives to the rhythm of images: Festival, shoots, music videos and commercials. Dressing a production means understanding character, light, camera movement and time pressure.</p><p>Autour D'Un Soir has worked with audiovisual production for decades. This guide explains that behind-the-scenes craft, often invisible but essential to credibility on screen.</p>"
        sections:
          role:
            title: The costume designer's role
            body_html: "<p>The costume designer translates era, social status and personality. A jacket that looks too new, a dress that feels too contemporary or a poorly chosen colour can contradict the character before they even speak.</p><p>The work is also logistical: anticipating alterations between takes, planning duplicates if a scene dirties or damages an outfit, adapting clothing to camera movement and continuity. Costume must tell something while supporting the constraints of a set.</p>"
          cannes:
            title: Cannes, a filming city
            body_html: "<p>The Riviera attracts varied productions thanks to its settings: seaside, hotels, villas, old streets, ports and places associated with the Festival. Cannes also concentrates an image culture that can make requests very fast-moving.</p><p>In that context, a varied stock is useful because a shoot may need a contemporary silhouette, a tuxedo, an evening gown or a period costume on a short timeline. Availability is not enough: the piece also has to work on screen.</p>"
          stock:
            title: A wardrobe built for the image
            body_html: '<p>Period costume, tuxedos, evening gowns, uniforms: diversity covers varied silhouettes and styles. See also <a href="/en/nos_autres_activites">our corporate and audiovisual services</a>.</p>'
        faq:
          q1:
            question: Does the shop lend costumes for shoots?
            answer_html: "<p>Yes, on quote depending on project, dates and required pieces.</p>"
          q2:
            question: Do you work only in Cannes?
            answer_html: "<p>We are based in Cannes but support productions across the French Riviera.</p>"
          q3:
            question: Do you offer express alterations?
            answer_html: "<p>Yes, the workshop can act quickly between takes or before an event.</p>"
      habiller_evenement_entreprise_gala:
        link_title: Gala & corporate
        header_title: Dressing a gala or corporate event
        header_subtitle: Behind a group wardrobe service
        intro_html: "<p>Galas, award ceremonies, corporate evenings, wedding parties: dressing a group requires logistics, visual consistency and responsiveness. It is not only about sizes: deadlines, fittings and the overall image matter.</p><p>Autour D'Un Soir regularly supports companies and planners on the Riviera. Here is how we structure this type of project.</p>"
        sections:
          preparation:
            title: Preparing group wardrobe
            body_html: "<p>We start by understanding dress code, headcount, deadlines and budget. A tailored quote specifies pieces, alterations and pickup dates.</p>"
          logistique:
            title: Logistics and fittings
            body_html: "<p>For groups we schedule staggered fittings or size-based selections. The goal: every participant feels comfortable, not only « correctly dressed ».</p>"
          image:
            title: Visual consistency
            body_html: '<p>Matching tuxedos, harmonised long gowns, coordinated accessories: the whole tells the event on stage and in photos. See also <a href="/en/guides/tenue-gala-ceremonie">gala outfit guide</a>.</p>'
        faq:
          q1:
            question: Do you offer group rates?
            answer_html: "<p>Yes, adapted terms are possible depending on volume and rental duration.</p>"
          q2:
            question: Can you dress a wedding party?
            answer_html: "<p>Yes, we regularly support witnesses, parents and guests for Riviera weddings.</p>"
          q3:
            question: How to request a quote?
            answer_html: <p>Contact the shop by phone or via the <a href="/en/contact">contact form</a>.</p>
      histoire_robe_de_mariee_traditions:
        link_title: Wedding dress history
        header_title: History of the wedding dress
        header_subtitle: Traditions, symbols and evolution
        intro_html: "<p>The white dress has not always been the norm. For centuries brides wore their finest dress — often colourful — and white gradually became a symbol of purity and social status.</p><p>Understanding this history sheds light on today's choices: why we attach ourselves to certain silhouettes, and how the wedding dress keeps evolving.</p>"
        sections:
          origines:
            title: Origins and symbols
            body_html: "<p>In antiquity and the Middle Ages, the wedding dress often signalled family wealth more than a single style. Brides frequently wore their finest dress, sometimes colourful, with fabrics and ornaments indicating social rank.</p><p>In Western usage, white spread gradually in the 19th century, notably after Queen Victoria's wedding in 1840. It later became strongly associated with the bride, although ivory, champagne and other shades remain very present.</p>"
          couleurs:
            title: Colours and cultures
            body_html: "<p>Red in several Asian traditions, blue associated with fidelity in some older European usages, white in the modern Western imagination: marriage remains a cultural ritual before it is a simple fashion question.</p><p>Today ivory, champagne, nude, blush or touches of colour sit alongside pure white. These shades change how the dress reads on skin and in photos: optical white can look very bright, while ivory often softens contrast.</p>"
          moderne:
            title: The contemporary bride
            body_html: '<p>Second marriage, civil wedding, short dress, suit: codes are opening up. In Cannes we support this diversity. See <a href="/en/guides/comment-choisir-sa-robe-de-mariee">how to choose your dress</a>.</p>'
        faq:
          q1:
            question: Must the dress be white?
            answer_html: "<p>No. Ivory, champagne or colour are perfectly possible depending on your style and ceremony.</p>"
          q2:
            question: When did white become popular?
            answer_html: "<p>Especially from the 19th century in Europe, with royal and bourgeois fashion influence.</p>"
          q3:
            question: Where to try a dress in Cannes?
            answer_html: <p>At Autour D'Un Soir. See <a href="/en/robe-de-mariee-cannes">wedding dress Cannes</a>.</p>
      se_marier_cote_azur_lieux_saisons:
        link_title: Riviera wedding
        header_title: Getting married on the French Riviera
        header_subtitle: Places, seasons and atmospheres
        intro_html: "<p>The Riviera offers a unique palette: sea, pine trees, Provence estates, Belle Époque villas and Mediterranean light. Each setting suggests a mood — and an outfit.</p><p>This informative guide helps you imagine your wedding on the Côte d'Azur: seasons, settings and dress logic, without a vendor list.</p>"
        sections:
          lieux:
            title: Iconic settings
            body_html: "<p>Cannes and surroundings: seaside, hills, olive estates, historic villas. Nice and Monaco extend the range for more urban or glamorous weddings.</p>"
          saisons:
            title: Seasons on the Riviera
            body_html: "<p>Mild spring, bright windy summer, golden autumn: each season has advantages. Summer calls for breathable fabrics; spring allows fuller trains without excessive heat.</p>"
          tenue:
            title: Outfit and setting
            body_html: <p>An outdoor Riviera wedding often favours flowing dresses, light fabrics and shoes suited to the ground. In store we build these constraints into fitting from the start. See <a href="/en/robe-de-mariee-cannes">wedding dresses in Cannes</a>.</p>
        faq:
          q1:
            question: What is the best season to marry on the Riviera?
            answer_html: "<p>Spring and autumn often offer pleasant weather and beautiful light. Summer is popular but hotter.</p>"
          q2:
            question: Should the dress match the venue?
            answer_html: "<p>Yes: length, train and fabric should account for ground and wind, especially outdoors.</p>"
          q3:
            question: Is the shop accessible from Nice or Monaco?
            answer_html: "<p>Yes, Cannes is about 30 minutes from Nice and 45 from Monaco by car.</p>"
      festival_de_cannes_histoire_tenues:
        link_title: Cannes Festival outfits
        header_title: Cannes Festival and its iconic looks
        header_subtitle: History of the Cannes red carpet
        intro_html: "<p>Since 1946 the Cannes Festival has turned the city into a global showcase of elegance. Long gowns, tuxedos, bold creations: the red carpet tells the story of fashion as much as cinema.</p><p>We have watched these dress codes evolve. This guide traces that history — and the link between Festival and our shop.</p>"
        sections:
          tapis:
            title: Birth of the red carpet
            body_html: "<p>The red carpet gradually became a ritual of representation. It organises the arrival of artists, creates symbolic distance from the public and gives photographers an instantly recognisable frame.</p><p>In Cannes, this ritual has become inseparable from the Festival's image: outfits are discussed as much as films because they also tell a story about an era, a fashion house, a personality and sometimes a risk taken.</p>"
          evolution:
            title: Evolving silhouettes
            body_html: "<p>From the 1950s to contemporary creations, gala dresses have grown bolder: sculptural volume, open backs, slits, embroidery and controlled transparency. Silhouettes change, but the long gown remains a strong reference for major events.</p><p>For men, the classic tuxedo remains a reference while now coexisting with more modern interpretations: coloured jackets, slimmer cuts, lapel details or less expected accessories.</p>"
          boutique:
            title: Autour D'Un Soir and the Festival
            body_html: <p>During the Festival the shop welcomes clients and professionals for evening wear and tuxedos. See our <a href="/en/festival-de-cannes">Cannes Festival</a> page and <a href="/en/guides/tenue-gala-ceremonie">gala outfit guide</a>.</p>
        faq:
          q1:
            question: Can I come without an appointment during the Festival?
            answer_html: "<p>Yes, during the Cannes Festival the shop welcomes walk-ins subject to availability.</p>"
          q2:
            question: Do you offer rental and sales?
            answer_html: "<p>Yes, evening gowns, tuxedos and accessories for rental or purchase.</p>"
          q3:
            question: Where is the shop?
            answer_html: "<p>29 boulevard Carnot, 06400 Cannes, a few minutes from the Palais des Festivals.</p>"
