# Champs de mesures par template — extraits des PDF papier (docs/formulaire mesures *.pdf).
# key    : clé stable du JSON measurements + clé i18n (mensurations.fields.<key>)
# required : * sur le papier
# zone   : numéro d'illustration du formulaire papier (slot visuel 2D, remplaçable par la 3D)
# input  : text par défaut ; "choice" = liste de valeurs (i18n mensurations.choices.<key>)
femme:
  - key: hauteur
    required: true
  - key: taille_robe_marque
    required: false
  - key: hauteur_talons
    required: false
  - key: taille_pantalon_jupe_marque
    required: false
  - key: preference_forme_robe
    required: false
    input: textarea
  - key: taille_veste_chemisier
    required: true
  - key: taille_soutien_gorge
    required: true
homme:
  - key: hauteur
    required: true
    zone: 1
  - key: tour_cou
    required: true
    zone: 0
  - key: coupe_chemise
    required: false
    input: choice
    choices: [slim, classique]
  - key: taille_veste
    required: true
  - key: taille_chemise
    required: true
  - key: tour_poitrine
    required: true
    zone: 2
  - key: tour_taille
    required: true
    zone: 3
  - key: tour_hanches
    required: true
    zone: 4
  - key: largeur_epaules
    required: true
    zone: 5
  - key: longueur_bras_ext
    required: true
    zone: 7
  - key: longueur_jambe_ext
    required: false
  - key: longueur_jambe_int
    required: false
  - key: taille_pantalon_marque
    required: false
  - key: tour_taille_ceinture
    required: false
  - key: tour_hanches_pantalon
    required: false
  - key: pointure
    required: false
